<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#29230d,#0b0b0b 40%,#050505);
  color:#fff;
}
.header{
  text-align:center;
  padding:22px 15px;
  background:rgba(8,8,8,.95);
  border-bottom:1px solid #5c4a16;
  position:sticky;
  top:0;
  z-index:20;
}
.logo{font-size:28px;font-weight:bold;color:#f5d76e}
.subtitle{color:#999;font-size:13px;margin-top:6px}
.container{max-width:650px;margin:20px auto;padding:12px}
.card,.post{
  background:linear-gradient(145deg,#181818,#0b0b0b);
  border:1px solid rgba(212,175,55,.3);
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 8px 30px #000;
}
.card{text-align:center}
.card h1{color:#f5d76e}
input[type=file]{width:100%;margin:12px 0;color:#ddd}
button{
  cursor:pointer;
}
#postButton{
  width:100%;
  padding:13px;
  border:1px solid #d4af37;
  border-radius:11px;
  background:linear-gradient(135deg,#f7df7b,#c99a18);
  color:#111;
  font-weight:bold;
}
#preview{
  display:none;
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:12px;
  margin:10px 0;
}
.postImageWrap{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:#000;
}
.post img{
  width:100%;
  max-height:650px;
  object-fit:contain;
  display:block;
  cursor:zoom-in;
}
.deletePhoto{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(130,0,0,.85);
  color:#fff;
  border:1px solid #ff5555;
  border-radius:9px;
  padding:7px 10px;
}
.likeButton,.commentButton{
  width:100%;
  margin-top:10px;
  padding:11px;
  border-radius:10px;
  border:1px solid #8c7220;
  background:#15120a;
  color:#f5d76e;
  font-weight:bold;
}
.likeCount{
  text-align:center;
  color:#aaa;
  margin:7px;
}
.commentBox{
  border-top:1px solid #3b3218;
  margin-top:12px;
  padding-top:12px;
}
.commentInput{
  width:100%;
  min-height:45px;
  padding:10px;
  border-radius:10px;
  background:#090909;
  border:1px solid #554617;
  color:#fff;
  resize:vertical;
}
.commentTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.commentTitle{color:#f5d76e;font-weight:bold}
.refreshComments{
  background:#111;
  color:#aaa;
  border:1px solid #554617;
  border-radius:7px;
  padding:5px 8px;
}
.commentItem{
  margin-top:8px;
  padding:10px;
  border-radius:11px;
  background:#121212;
  border:1px solid #332b15;
}
.commentHeader{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.commentName{color:#f5d76e;font-weight:bold}
.commentTime{color:#666;font-size:11px}
.commentText{margin-top:5px;color:#ddd}
.deleteComment{
  margin-top:7px;
  background:#240d0d;
  color:#ff7777;
  border:1px solid #6d2929;
  border-radius:7px;
  padding:5px 8px;
}
.noComments{
  color:#666;
  text-align:center;
  padding:10px;
}
.footer{text-align:center;color:#666;margin:30px}
.imageViewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(0,0,0,.96);
  align-items:center;
  justify-content:center;
  padding:15px;
}
.imageViewer.active{display:flex}
.viewerImage{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}
.closeViewer{
  position:fixed;
  top:15px;
  right:15px;
  width:43px;
  height:43px;
  border-radius:50%;
  background:#181818;
  color:#f5d76e;
  border:1px solid #d4af37;
  font-size:25px;
}
.navBtn{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:55px;
  border-radius:12px;
  background:rgba(20,20,20,.85);
  color:#f5d76e;
  border:1px solid #d4af37;
  font-size:28px;
  z-index:1001;
}
.prevBtn{left:10px}
.nextBtn{right:10px}
@media(max-width:480px){
  .logo{font-size:24px}
  .container{padding:9px}
  .post{padding:9px}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">📸 Picture Chat</div>
  <div class="subtitle">Premium Photo Sharing</div>
</div>

<div class="container">

<div class="card">
<h1>✨ স্বাগতম</h1>
<p>আপনার ছবি শেয়ার করুন এবং অন্যদের ছবিতে ❤️ Like ও 💬 Comment দিন।</p>

<input type="file" id="photoInput" accept="image/*">

<img id="preview" alt="Preview">

<button id="postButton">📤 পোস্ট করুন</button>

<p id="message"></p>
</div>

<div id="posts"></div>

<div class="footer">🖤 Picture Chat • 2026 ✨</div>

</div>

<div id="imageViewer" class="imageViewer">

<button id="closeViewer" class="closeViewer">×</button>

<button id="prevBtn" class="navBtn prevBtn">‹</button>

<img id="viewerImage" class="viewerImage">

<button id="nextBtn" class="navBtn nextBtn">›</button>

</div>

<script>

const SUPABASE_URL="https://syzauwriwjwnlwbcxlnf.supabase.co";
const SUPABASE_KEY="sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o";
const BUCKET="photos";

const ADMIN_UID="e482b1f1-03fb-4a36-9412-af71f89cb31d";

const photoInput=document.getElementById("photoInput");
const preview=document.getElementById("preview");
const postButton=document.getElementById("postButton");
const posts=document.getElementById("posts");
const message=document.getElementById("message");

const imageViewer=document.getElementById("imageViewer");
const viewerImage=document.getElementById("viewerImage");
const closeViewer=document.getElementById("closeViewer");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");

let selectedFile=null;
let viewerImages=[];
let viewerIndex=0;

function getGuestName(){

 let name=localStorage.getItem("picture_chat_guest_name");

 if(!name){
   name="Guest-"+Math.floor(1000+Math.random()*9000);
   localStorage.setItem("picture_chat_guest_name",name);
 }

 return name;
}

function formatTime(dateString){

 const date=new Date(dateString);
 const now=new Date();
 const seconds=Math.floor((now-date)/1000);

 if(seconds<60)return"এইমাত্র";

 const minutes=Math.floor(seconds/60);
 if(minutes<60)return minutes+" মিনিট আগে";

 const hours=Math.floor(minutes/60);
 if(hours<24)return hours+" ঘণ্টা আগে";

 const days=Math.floor(hours/24);
 if(days<7)return days+" দিন আগে";

 return date.toLocaleDateString("bn-BD");
}

photoInput.addEventListener("change",function(){

 const file=this.files[0];

 if(!file)return;

 selectedFile=file;

 const reader=new FileReader();

 reader.onload=function(e){

   preview.src=e.target.result;
   preview.style.display="block";
   message.innerText="✅ ছবি প্রস্তুত। এখন পোস্ট করুন।";

 };

 reader.readAsDataURL(file);

});

function openViewer(index){

 viewerIndex=index;
 viewerImage.src=viewerImages[viewerIndex];

 imageViewer.classList.add("active");
 document.body.style.overflow="hidden";

}

function closeImageViewer(){

 imageViewer.classList.remove("active");
 document.body.style.overflow="";
 viewerImage.src="";

}

function showNext(){

 if(!viewerImages.length)return;

 viewerIndex=(viewerIndex+1)%viewerImages.length;
 viewerImage.src=viewerImages[viewerIndex];

}

function showPrev(){

 if(!viewerImages.length)return;

 viewerIndex=(viewerIndex-1+viewerImages.length)%viewerImages.length;
 viewerImage.src=viewerImages[viewerIndex];

}

closeViewer.onclick=closeImageViewer;
nextBtn.onclick=showNext;
prevBtn.onclick=showPrev;

imageViewer.addEventListener("click",function(e){

 if(e.target===imageViewer){
   closeImageViewer();
 }

});

document.addEventListener("keydown",function(e){

 if(e.key==="Escape")closeImageViewer();
 if(e.key==="ArrowRight")showNext();
 if(e.key==="ArrowLeft")showPrev();

});

async function deletePhoto(fileName,post){

 if(!confirm("এই ছবিটি কি মুছে ফেলবেন?"))return;

 try{

   const response=await fetch(
     SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+encodeURIComponent(fileName),
     {
       method:"DELETE",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY
       }
     }
   );

   if(!response.ok)throw new Error(await response.text());

   await fetch(
     SUPABASE_URL+"/rest/v1/photo_posts?file_name=eq."+encodeURIComponent(fileName),
     {
       method:"DELETE",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY
       }
     }
   );

   await fetch(
     SUPABASE_URL+"/rest/v1/photo_comments?file_name=eq."+encodeURIComponent(fileName),
     {
       method:"DELETE",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY
       }
     }
   );

   post.remove();

 }catch(error){

   console.log(error);
   alert("❌ ছবি মুছতে সমস্যা হয়েছে।");

 }

}

async function deleteComment(id,commentItem){

 if(!confirm("এই Comment মুছে ফেলবেন?"))return;

 try{

   const response=await fetch(
     SUPABASE_URL+"/rest/v1/photo_comments?id=eq."+encodeURIComponent(id),
     {
       method:"DELETE",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY
       }
     }
   );

   if(!response.ok)throw new Error(await response.text());

   commentItem.remove();

 }catch(error){

   console.log(error);
   alert("❌ Comment মুছতে সমস্যা হয়েছে।");

 }

}

async function loadComments(fileName,commentsList){

 commentsList.innerHTML="<div class='noComments'>⏳ Comment লোড হচ্ছে...</div>";

 try{

   const response=await fetch(
     SUPABASE_URL+
     "/rest/v1/photo_comments"+
     "?select=id,comment,created_at"+
     "&file_name=eq."+encodeURIComponent(fileName)+
     "&order=created_at.desc",
     {
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY
       }
     }
   );

   if(!response.ok)throw new Error(await response.text());

   const comments=await response.json();

   commentsList.innerHTML="";

   if(!comments.length){

     commentsList.innerHTML="<div class='noComments'>এখনও কোনো Comment নেই।</div>";
     return;

   }

   comments.forEach(item=>{

     const div=document.createElement("div");
     div.className="commentItem";

     const parts=item.comment.split("|||");

     const name=parts.length>=2?parts[0]:"Guest";
     const text=parts.length>=2?parts.slice(1).join("|||"):item.comment;

     const header=document.createElement("div");
     header.className="commentHeader";

     const user=document.createElement("div");
     user.className="commentName";
     user.innerText="👤 "+name;

     const time=document.createElement("div");
     time.className="commentTime";
     time.innerText=formatTime(item.created_at);

     header.appendChild(user);
     header.appendChild(time);

     const commentText=document.createElement("div");
     commentText.className="commentText";
     commentText.innerText="💬 "+text;

     const deleteBtn=document.createElement("button");
     deleteBtn.className="deleteComment";
     deleteBtn.innerText="🗑️ Delete Comment";

     deleteBtn.onclick=()=>deleteComment(item.id,div);

     div.appendChild(header);
     div.appendChild(commentText);
     div.appendChild(deleteBtn);

     commentsList.appendChild(div);

   });

 }catch(error){

   console.log(error);
   commentsList.innerHTML="<div class='noComments'>❌ Comment লোড হয়নি</div>";

 }

}

async function loadPosts(){

 posts.innerHTML="<p style='text-align:center;color:#aaa'>⏳ ছবি লোড হচ্ছে...</p>";

 try{

   const response=await fetch(
     SUPABASE_URL+"/storage/v1/object/list/"+BUCKET,
     {
       method:"POST",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY,
         "Content-Type":"application/json"
       },
       body:JSON.stringify({
         prefix:"",
         limit:100,
         sortBy:{
           column:"created_at",
           order:"desc"
         }
       })
     }
   );

   if(!response.ok)throw new Error(await response.text());

   const files=await response.json();

   posts.innerHTML="";
   viewerImages=[];

   const validFiles=files.filter(file=>file.name);

   validFiles.forEach(file=>{

     const imageUrl=
       SUPABASE_URL+
       "/storage/v1/object/public/"+
       BUCKET+"/"+
       encodeURIComponent(file.name);

     viewerImages.push(imageUrl);

   });

   for(let i=0;i<validFiles.length;i++){

     const file=validFiles[i];

     const imageUrl=viewerImages[i];

     let likes=0;

     try{

       const likeResponse=await fetch(
         SUPABASE_URL+
         "/rest/v1/photo_posts?select=likes&file_name=eq."+
         encodeURIComponent(file.name),
         {
           headers:{
             apikey:SUPABASE_KEY,
             Authorization:"Bearer "+SUPABASE_KEY
           }
         }
       );

       if(likeResponse.ok){

         const data=await likeResponse.json();

         if(data.length)likes=Number(data[0].likes||0);

       }

     }catch(e){}

     const post=document.createElement("div");
     post.className="post";

     const imageWrap=document.createElement("div");
     imageWrap.className="postImageWrap";

     const image=document.createElement("img");
     image.src=imageUrl;
     image.alt="Shared photo";
     image.loading="lazy";

     image.onclick=()=>openViewer(i);

     imageWrap.appendChild(image);

     const deletePhotoBtn=document.createElement("button");
     deletePhotoBtn.className="deletePhoto";
     deletePhotoBtn.innerText="🗑️ Delete";

     deletePhotoBtn.onclick=()=>deletePhoto(file.name,post);

     imageWrap.appendChild(deletePhotoBtn);

     const likeButton=document.createElement("button");
     likeButton.className="likeButton";
     likeButton.innerText="❤️ Like";

     const likeCount=document.createElement("div");
     likeCount.className="likeCount";
     likeCount.innerText="❤️ "+likes+" Likes";

     likeButton.onclick=async()=>{

       likeButton.disabled=true;
       likeButton.innerText="⏳ Like হচ্ছে...";

       try{

         const r=await fetch(
           SUPABASE_URL+
           "/rest/v1/photo_posts?file_name=eq."+
           encodeURIComponent(file.name),
           {
             method:"PATCH",
             headers:{
               apikey:SUPABASE_KEY,
               Authorization:"Bearer "+SUPABASE_KEY,
               "Content-Type":"application/json"
             },
             body:JSON.stringify({likes:likes+1})
           }
         );

         if(!r.ok)throw new Error();

         likes++;

         likeCount.innerText="❤️ "+likes+" Likes";
         likeButton.innerText="❤️ Liked";

       }catch(e){

         likeButton.innerText="❌ আবার চেষ্টা করুন";

       }

       setTimeout(()=>{
         likeButton.innerText="❤️ Like";
         likeButton.disabled=false;
       },800);

     };

     const commentBox=document.createElement("div");
     commentBox.className="commentBox";

     const top=document.createElement("div");
     top.className="commentTop";

     const title=document.createElement("div");
     title.className="commentTitle";
     title.innerText="💬 Comments";

     const refresh=document.createElement("button");
     refresh.className="refreshComments";
     refresh.innerText="🔄 Refresh";

     const input=document.createElement("textarea");
     input.className="commentInput";
     input.placeholder="💬 আপনার Comment লিখুন...";
     input.maxLength=500;

     const commentButton=document.createElement("button");
     commentButton.className="commentButton";
     commentButton.innerText="💬 Comment করুন";

     const commentsList=document.createElement("div");
     commentsList.className="commentsList";

     refresh.onclick=async()=>{
       await loadComments(file.name,commentsList);
     };

     commentButton.onclick=async()=>{

       const text=input.value.trim();

       if(!text)return;

       commentButton.disabled=true;
       commentButton.innerText="⏳ Comment হচ্ছে...";

       try{

         const saved=getGuestName()+"|||"+text;

         const r=await fetch(
           SUPABASE_URL+"/rest/v1/photo_comments",
           {
             method:"POST",
             headers:{
               apikey:SUPABASE_KEY,
               Authorization:"Bearer "+SUPABASE_KEY,
               "Content-Type":"application/json"
             },
             body:JSON.stringify({
               file_name:file.name,
               comment:saved
             })
           }
         );

         if(!r.ok)throw new Error();

         input.value="";
         await loadComments(file.name,commentsList);

       }catch(e){

         alert("❌ Comment পোস্ট হয়নি");

       }

       commentButton.disabled=false;
       commentButton.innerText="💬 Comment করুন";

     };

     input.addEventListener("keydown",e=>{

       if(e.key==="Enter"&&!e.shiftKey){

         e.preventDefault();
         commentButton.click();

       }

     });

     top.appendChild(title);
     top.appendChild(refresh);

     commentBox.appendChild(top);
     commentBox.appendChild(input);
     commentBox.appendChild(commentButton);
     commentBox.appendChild(commentsList);

     post.appendChild(imageWrap);
     post.appendChild(likeButton);
     post.appendChild(likeCount);
     post.appendChild(commentBox);

     posts.appendChild(post);

     await loadComments(file.name,commentsList);

   }

   if(!validFiles.length){

     posts.innerHTML="<p style='text-align:center;color:#aaa'>এখনও কোনো ছবি নেই।</p>";

   }

 }catch(error){

   console.log(error);
   posts.innerHTML="<p style='text-align:center;color:#ff7777'>❌ ছবি লোড হয়নি</p>";

 }

}

postButton.onclick=async()=>{

 if(!selectedFile){

   message.innerText="⚠️ আগে একটি ছবি নির্বাচন করুন।";
   return;

 }

 postButton.disabled=true;
 message.innerText="⏳ ছবি আপলোড হচ্ছে...";

 try{

   const safeName=selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");

   const fileName=Date.now()+"-"+safeName;

   const uploadResponse=await fetch(
     SUPABASE_URL+
     "/storage/v1/object/"+
     BUCKET+"/"+
     encodeURIComponent(fileName),
     {
       method:"POST",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY,
         "Content-Type":selectedFile.type||"application/octet-stream"
       },
       body:selectedFile
     }
   );

   if(!uploadResponse.ok)
     throw new Error(await uploadResponse.text());

   await fetch(
     SUPABASE_URL+"/rest/v1/photo_posts",
     {
       method:"POST",
       headers:{
         apikey:SUPABASE_KEY,
         Authorization:"Bearer "+SUPABASE_KEY,
         "Content-Type":"application/json"
       },
       body:JSON.stringify({
         file_name:fileName,
         likes:0
       })
     }
   );

   message.innerText="🎉 ছবি সফলভাবে পোস্ট হয়েছে!";

   selectedFile=null;
   photoInput.value="";
   preview.src="";
   preview.style.display="none";

   await loadPosts();

 }catch(error){

   console.log(error);
   message.innerText="❌ আপলোড হয়নি";

 }

 postButton.disabled=false;

};

loadPosts();

</script>

</body>
</html>
