<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Picture Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#29230d 0%,#0b0b0b 40%,#050505 100%);
  color:#fff;
  min-height:100vh;
}

.container{
  width:min(900px,94%);
  margin:auto;
  padding:25px 0 50px;
}

header{
  text-align:center;
  padding:20px 10px 25px;
}

.logo{
  font-size:34px;
  font-weight:bold;
}

.subtitle{
  color:#aaa;
  margin-top:7px;
}

.card{
  background:rgba(20,20,20,.92);
  border:1px solid #3b351d;
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

h2{
  margin:0 0 15px;
  font-size:20px;
}

input[type="email"],
input[type="password"],
input[type="file"],
textarea{
  width:100%;
  background:#111;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

textarea{
  resize:none;
  min-height:45px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
  background:#d5af37;
  color:#111;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.admin-btn{
  background:#d5af37;
}

.logout-btn{
  background:#8d2525;
  color:#fff;
}

.status{
  text-align:center;
  color:#d5af37;
  margin:10px 0 20px;
  font-weight:bold;
}

.photo-card{
  overflow:hidden;
}

.photo{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#000;
  border-radius:14px;
  cursor:pointer;
}

.photo-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.user{
  font-weight:bold;
  color:#ddd;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.like-btn{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.like-btn.liked{
  background:#4b1515;
  color:#ff7070;
}

.comment-btn{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.delete-btn{
  background:#8d2525;
  color:#fff;
}

.comment-box{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.comment-box textarea{
  margin:0;
  flex:1;
}

.send-btn{
  min-width:50px;
  background:#d5af37;
}

.comments{
  margin-top:12px;
}

.comment{
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  padding:10px;
  margin-top:8px;
}

.comment-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:#bbb;
}

.comment-text{
  margin-top:6px;
  white-space:pre-wrap;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px 10px;
}

.hidden{
  display:none !important;
}

.login-box{
  max-width:500px;
  margin:auto;
}

.admin-info{
  text-align:center;
  color:#d5af37;
  margin-bottom:12px;
}

.fullscreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.fullscreen img{
  max-width:100%;
  max-height:95vh;
  object-fit:contain;
}

.close-full{
  position:absolute;
  top:15px;
  right:15px;
  background:#fff;
  color:#111;
  border-radius:50%;
  width:42px;
  height:42px;
  padding:0;
  font-size:22px;
}

.note{
  text-align:center;
  color:#aaa;
  font-size:14px;
  margin-top:10px;
}

/* ================================
   ADMIN LOGIN BUTTON
================================ */

.admin-login-open{
  display:block;
  margin:auto;
  background:linear-gradient(135deg,#d5af37,#f1d36a,#b88a18);
  color:#111;
  box-shadow:0 5px 20px rgba(213,175,55,.18);
}

/* ================================
   ADMIN LOGIN MODAL
================================ */

.admin-login-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10000;
}

.admin-login-panel{
  width:min(430px,100%);
  background:linear-gradient(
    145deg,
    #1b1b1b,
    #0c0c0c
  );
  border:1px solid #5a4a20;
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  position:relative;
}

.admin-login-title{
  text-align:center;
  color:#d5af37;
  font-size:21px;
  font-weight:bold;
  margin-bottom:18px;
}

.admin-login-close{
  position:absolute;
  top:10px;
  right:10px;
  width:36px;
  height:36px;
  padding:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:22px;
}

.admin-login-close:hover{
  background:#8d2525;
}

.admin-login-panel input{
  margin-bottom:12px;
}

.admin-login-submit{
  width:100%;
  background:linear-gradient(
    135deg,
    #d5af37,
    #f0cf62
  );
}

@media(max-width:600px){

  .logo{
    font-size:28px;
  }

  .container{
    width:94%;
  }

  .photo-info{
    align-items:flex-start;
    flex-direction:column;
  }

  .comment-box{
    align-items:stretch;
  }

  .send-btn{
    min-width:55px;
  }

  .admin-login-panel{
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">📸 Picture Chat</div>
  <div class="subtitle">Premium Photo Sharing</div>
</header>


<!-- =================================
     ADMIN AREA
================================= -->

<div class="card" id="adminCard">

  <h2>🔐 Admin</h2>

  <!-- PUBLIC VIEW -->
  <div id="loginArea">

    <button
      class="admin-login-open"
      onclick="openAdminLogin()"
    >
      👑 Admin Login
    </button>

  </div>


  <!-- LOGGED IN ADMIN VIEW -->
  <div id="loggedInArea" class="hidden">

    <div class="admin-info">
      👑 Admin হিসেবে লগইন করা আছে
    </div>

    <button
      class="logout-btn"
      onclick="logoutAdmin()"
    >
      🚪 Logout
    </button>

  </div>

</div>


<!-- =================================
     ADMIN LOGIN MODAL
================================= -->

<div
  id="adminLoginModal"
  class="admin-login-modal hidden"
>

  <div class="admin-login-panel">

    <button
      class="admin-login-close"
      onclick="closeAdminLogin()"
    >
      ×
    </button>

    <div class="admin-login-title">
      👑 Admin Login
    </div>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password"
      autocomplete="current-password"
    >

    <button
      class="admin-login-submit"
      onclick="loginAdmin()"
    >
      🔐 Login
    </button>

  </div>

</div>


<!-- =================================
     UPLOAD AREA
================================= -->

<div
  class="card hidden"
  id="uploadCard"
>

  <h2>📤 ছবি শেয়ার করুন</h2>

  <input
    type="file"
    id="photoFile"
    accept="image/*"
  >

  <button onclick="uploadPhoto()">
    📸 পোস্ট করুন
  </button>

  <div
    id="uploadStatus"
    class="note"
  ></div>

</div>


<div
  class="status"
  id="publicStatus"
>
  👀 ছবি দেখুন • ❤️ Like দিন • 💬 Comment করুন
</div>


<!-- =================================
     PHOTOS
================================= -->

<div class="card">

  <h2>🖼️ Shared Photos</h2>

  <div id="photos">

    <div class="empty">
      ছবি লোড হচ্ছে...
    </div>

  </div>

</div>

</div>


<!-- =================================
     FULLSCREEN
================================= -->

<div
  id="fullscreen"
  class="fullscreen hidden"
>

  <button
    class="close-full"
    onclick="closeFullscreen()"
  >
    ×
  </button>

  <img
    id="fullscreenImage"
    src=""
    alt="Full Image"
  >

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://syzauwriwjwnlwbcxlnf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ADMIN_UID =
"e482b1f1-03fb-4a36-9412-af71f89cb31d";

const ADMIN_ACCESS_KEY =
"picture_chat_admin_access_token";

const ADMIN_REFRESH_KEY =
"picture_chat_admin_refresh_token";

const GUEST_NAME_KEY =
"picture_chat_guest_name";


// ================================
// GUEST NAME
// ================================

function getGuestName(){

  let name =
    localStorage.getItem(
      GUEST_NAME_KEY
    );

  if(!name){

    const number =
      Math.floor(
        1000 +
        Math.random() * 9000
      );

    name =
      "Guest-" +
      number;

    localStorage.setItem(
      GUEST_NAME_KEY,
      name
    );
  }

  return name;
}


// ================================
// LIKE LOCAL KEY
// ================================

function likeKey(fileName){

  return (
    "picture_chat_liked_" +
    fileName
  );

}


// ================================
// ADMIN CHECK
// ================================

function isAdmin(){

  return !!localStorage.getItem(
    ADMIN_ACCESS_KEY
  );

}


// ================================
// OPEN ADMIN LOGIN
// ================================

function openAdminLogin(){

  const modal =
    document.getElementById(
      "adminLoginModal"
    );

  modal.classList.remove(
    "hidden"
  );

  setTimeout(function(){

    document
      .getElementById(
        "adminEmail"
      )
      .focus();

  },100);

}


// ================================
// CLOSE ADMIN LOGIN
// ================================

function closeAdminLogin(){

  document
    .getElementById(
      "adminLoginModal"
    )
    .classList.add(
      "hidden"
    );

}


// ================================
// ADMIN UI
// ================================

function updateAdminUI(){

  const uploadCard =
    document.getElementById(
      "uploadCard"
    );

  const loginArea =
    document.getElementById(
      "loginArea"
    );

  const loggedInArea =
    document.getElementById(
      "loggedInArea"
    );

  const modal =
    document.getElementById(
      "adminLoginModal"
    );


  if(isAdmin()){

    uploadCard.classList.remove(
      "hidden"
    );

    loginArea.classList.add(
      "hidden"
    );

    loggedInArea.classList.remove(
      "hidden"
    );

    modal.classList.add(
      "hidden"
    );

  }else{

    uploadCard.classList.add(
      "hidden"
    );

    loginArea.classList.remove(
      "hidden"
    );

    loggedInArea.classList.add(
      "hidden"
    );

  }

}


// ================================
// RESTORE ADMIN SESSION
// ================================

async function restoreAdminSession(){

  try{

    const accessToken =
      localStorage.getItem(
        ADMIN_ACCESS_KEY
      );

    const refreshToken =
      localStorage.getItem(
        ADMIN_REFRESH_KEY
      );

    if(
      !accessToken ||
      !refreshToken
    ){

      updateAdminUI();
      return;

    }


    const { data, error } =
      await supabaseClient.auth.setSession({

        access_token:
          accessToken,

        refresh_token:
          refreshToken

      });


    if(
      error ||
      !data.session
    ){

      localStorage.removeItem(
        ADMIN_ACCESS_KEY
      );

      localStorage.removeItem(
        ADMIN_REFRESH_KEY
      );

      updateAdminUI();

      return;

    }


    if(
      !data.user ||
      data.user.id !== ADMIN_UID
    ){

      await supabaseClient.auth.signOut();

      localStorage.removeItem(
        ADMIN_ACCESS_KEY
      );

      localStorage.removeItem(
        ADMIN_REFRESH_KEY
      );

    }

  }catch(error){

    console.error(error);

  }

  updateAdminUI();

}


// ================================
// ADMIN LOGIN
// ================================

async function loginAdmin(){

  const email =
    document
      .getElementById(
        "adminEmail"
      )
      .value
      .trim();


  const password =
    document.getElementById(
      "adminPassword"
    ).value;


  if(
    !email ||
    !password
  ){

    alert(
      "Email এবং Password দিন।"
    );

    return;

  }


  try{

    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({

          email,
          password

        });


    if(error){

      alert(
        "Login failed: " +
        error.message
      );

      return;

    }


    if(
      !data.user ||
      data.user.id !== ADMIN_UID
    ){

      await supabaseClient.auth.signOut();

      alert(
        "এই Account Admin নয়।"
      );

      return;

    }


    localStorage.setItem(
      ADMIN_ACCESS_KEY,
      data.session.access_token
    );

    localStorage.setItem(
      ADMIN_REFRESH_KEY,
      data.session.refresh_token
    );


    updateAdminUI();


    alert(
      "👑 Admin Login সফল হয়েছে।"
    );


    loadPhotos();

  }catch(error){

    console.error(error);

    alert(
      "Login করতে সমস্যা হয়েছে।"
    );

  }

}


// ================================
// ADMIN LOGOUT
// ================================

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  localStorage.removeItem(
    ADMIN_ACCESS_KEY
  );

  localStorage.removeItem(
    ADMIN_REFRESH_KEY
  );

  updateAdminUI();

  loadPhotos();

}


// ================================
// UPLOAD PHOTO
// ================================

async function uploadPhoto(){

  if(!isAdmin()){

    alert(
      "শুধু Admin ছবি পোস্ট করতে পারবেন।"
    );

    return;

  }


  const fileInput =
    document.getElementById(
      "photoFile"
    );


  const file =
    fileInput.files[0];


  if(!file){

    alert(
      "আগে একটি ছবি নির্বাচন করুন।"
    );

    return;

  }


  const status =
    document.getElementById(
      "uploadStatus"
    );


  status.textContent =
    "ছবি আপলোড হচ্ছে...";


  try{

    const fileName =
      Date.now() +
      "-" +
      Math.floor(
        Math.random() * 100000
      ) +
      "." +
      (
        file.name.split(".").pop() ||
        "jpg"
      );


    const path =
      fileName;


    const { error: uploadError } =
      await supabaseClient.storage
        .from("photos")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(uploadError){

      throw uploadError;

    }


    const { error: insertError } =
      await supabaseClient
        .from("photo_posts")
        .insert({

          file_name:fileName,

          likes:0,

          user_id:ADMIN_UID,

          user_name:"Admin"

        });


    if(insertError){

      await supabaseClient
        .storage
        .from("photos")
        .remove([path]);

      throw insertError;

    }


    status.textContent =
      "✅ ছবি সফলভাবে পোস্ট হয়েছে।";


    fileInput.value = "";


    await loadPhotos();

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ আপলোড ব্যর্থ হয়েছে।";


    alert(
      error.message ||
      "ছবি আপলোড করা যায়নি।"
    );

  }

}


// ================================
// LOAD PHOTOS
// ================================

async function loadPhotos(){

  const photos =
    document.getElementById(
      "photos"
    );


  photos.innerHTML =
    '<div class="empty">ছবি লোড হচ্ছে...</div>';


  try{

    const { data, error } =
      await supabaseClient
        .from("photo_posts")
        .select(
          "id,file_name,likes,created_at,user_id,user_name"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    if(
      !data ||
      data.length === 0
    ){

      photos.innerHTML =
        '<div class="empty">এখনো কোনো ছবি পোস্ট করা হয়নি।</div>';

      return;

    }


    photos.innerHTML = "";


    data.forEach(post => {

      renderPhoto(post);

    });


  }catch(error){

    console.error(error);

    photos.innerHTML =
      '<div class="empty">ছবি লোড করা যায়নি।</div>';

  }

}


// ================================
// RENDER PHOTO
// ================================

function renderPhoto(post){

  const photos =
    document.getElementById(
      "photos"
    );


  const publicUrl =
    SUPABASE_URL +
    "/storage/v1/object/public/photos/" +
    encodeURIComponent(
      post.file_name
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "photo-card card";


  const admin =
    post.user_id === ADMIN_UID ||
    post.user_name === "Admin";


  const liked =
    localStorage.getItem(
      likeKey(post.file_name)
    ) === "1";


  const userText =
    admin
      ? "👑 Admin"
      : "👤 " +
        (
          post.user_name ||
          "Guest"
        );


  card.innerHTML = `

    <img
      class="photo"
      src="${publicUrl}"
      alt="Shared Photo"
      onclick="openFullscreen('${publicUrl}')"
      loading="lazy"
    >

    <div class="photo-info">

      <div class="user">
        ${userText}
      </div>

      <div>
        ❤️
        <span
          id="like-${escapeId(post.file_name)}"
        >
          ${post.likes || 0}
        </span>
      </div>

    </div>


    <div class="actions">

      <button
        class="like-btn ${liked ? "liked" : ""}"
        id="like-btn-${escapeId(post.file_name)}"
        onclick="likePost('${escapeJs(post.file_name)}')"
        ${liked ? "disabled" : ""}
      >
        ${liked ? "❤️ Liked" : "❤️ Like"}
      </button>


      <button
        class="comment-btn"
        onclick="toggleComments('${escapeJs(post.file_name)}')"
      >
        💬 Comment
      </button>


      ${
        isAdmin()
        ?
        `
        <button
          class="delete-btn"
          onclick="deletePhoto('${escapeJs(post.file_name)}')"
        >
          🗑️ Delete Photo
        </button>
        `
        :
        ""
      }

    </div>


    <div
      class="comments hidden"
      id="comments-${escapeId(post.file_name)}"
    >

      <div
        id="comment-list-${escapeId(post.file_name)}"
      >

        <div class="empty">
          কমেন্ট লোড হচ্ছে...
        </div>

      </div>


      <div class="comment-box">

        <textarea
          id="comment-input-${escapeId(post.file_name)}"
          placeholder="কমেন্ট লিখুন..."
        ></textarea>


        <button
          class="send-btn"
          onclick="addComment('${escapeJs(post.file_name)}')"
        >
          ➤
        </button>

      </div>

    </div>

  `;


  photos.appendChild(card);

}


// ================================
// LIKE
// ================================

async function likePost(fileName){

  const key =
    likeKey(fileName);


  if(
    localStorage.getItem(key) === "1"
  ){

    alert(
      "আপনি এই ছবিতে ইতিমধ্যে Like দিয়েছেন ❤️"
    );

    return;

  }


  const button =
    document.getElementById(
      "like-btn-" +
      escapeId(fileName)
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "❤️ ...";

  }


  try{

    const guestName =
      getGuestName();


    const { data, error } =
      await supabaseClient.rpc(
        "add_photo_like",
        {
          p_file_name:fileName,
          p_guest_name:guestName
        }
      );


    if(error){

      throw error;

    }


    localStorage.setItem(
      key,
      "1"
    );


    const likeCount =
      document.getElementById(
        "like-" +
        escapeId(fileName)
      );


    if(likeCount){

      likeCount.textContent =
        data || 0;

    }


    if(button){

      button.textContent =
        "❤️ Liked";

      button.classList.add(
        "liked"
      );

      button.disabled = true;

    }

  }catch(error){

    console.error(error);


    if(button){

      button.disabled = false;

      button.textContent =
        "❤️ Like";

    }


    alert(
      error.message ||
      "Like দিতে সমস্যা হয়েছে।"
    );

  }

}


// ================================
// COMMENTS TOGGLE
// ================================

async function toggleComments(fileName){

  const box =
    document.getElementById(
      "comments-" +
      escapeId(fileName)
    );


  if(!box) return;


  const hidden =
    box.classList.contains(
      "hidden"
    );


  if(hidden){

    box.classList.remove(
      "hidden"
    );


    await loadComments(
      fileName
    );

  }else{

    box.classList.add(
      "hidden"
    );

  }

}


// ================================
// LOAD COMMENTS
// ================================

async function loadComments(fileName){

  const list =
    document.getElementById(
      "comment-list-" +
      escapeId(fileName)
    );


  if(!list) return;


  try{

    const { data, error } =
      await supabaseClient
        .from("photo_comments")
        .select(
          "id,file_name,comment,created_at,user_id,user_name"
        )
        .eq(
          "file_name",
          fileName
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(error){

      throw error;

    }


    if(
      !data ||
      data.length === 0
    ){

      list.innerHTML =
        '<div class="empty">💬 এখনো কোনো কমেন্ট নেই</div>';

      return;

    }


    list.innerHTML = "";


    data.forEach(item => {

      const comment =
        document.createElement(
          "div"
        );


      comment.className =
        "comment";


      let text =
        item.comment || "";


      let name =
        item.user_name || "";


      if(
        !name &&
        text.includes("|||")
      ){

        const parts =
          text.split("|||");


        name =
          parts.shift();


        text =
          parts.join("|||");

      }


      const isAdminComment =
        item.user_id === ADMIN_UID ||
        name === "Admin";


      const displayName =
        isAdminComment
          ? "👑 Admin"
          : "👤 " +
            (
              name ||
              "Guest"
            );


      const date =
        new Date(
          item.created_at
        ).toLocaleString(
          "bn-BD"
        );


      comment.innerHTML = `

        <div class="comment-head">

          <strong>
            ${escapeHtml(displayName)}
          </strong>

          <span>
            ${escapeHtml(date)}
          </span>

        </div>


        <div class="comment-text">
          ${escapeHtml(text)}
        </div>


        ${
          isAdmin()
          ?
          `
          <button
            class="delete-btn"
            style="margin-top:8px"
            onclick="deleteComment('${escapeJs(item.id)}','${escapeJs(fileName)}')"
          >
            🗑️ Delete Comment
          </button>
          `
          :
          ""
        }

      `;


      list.appendChild(
        comment
      );

    });


  }catch(error){

    console.error(error);


    list.innerHTML =
      '<div class="empty">কমেন্ট লোড করা যায়নি।</div>';

  }

}


// ================================
// ADD COMMENT
// ================================

async function addComment(fileName){

  const input =
    document.getElementById(
      "comment-input-" +
      escapeId(fileName)
    );


  if(!input) return;


  const text =
    input.value.trim();


  if(!text){

    alert(
      "কমেন্ট লিখুন।"
    );

    return;

  }


  try{

    const admin =
      isAdmin();


    const guestName =
      getGuestName();


    const { error } =
      await supabaseClient
        .from("photo_comments")
        .insert({

          file_name:fileName,

          comment:text,

          user_id:
            admin
            ? ADMIN_UID
            : null,

          user_name:
            admin
            ? "Admin"
            : guestName

        });


    if(error){

      throw error;

    }


    input.value = "";


    await loadComments(
      fileName
    );


  }catch(error){

    console.error(error);


    alert(
      error.message ||
      "কমেন্ট পাঠানো যায়নি।"
    );

  }

}


// ================================
// DELETE COMMENT
// ================================

async function deleteComment(
  commentId,
  fileName
){

  if(!isAdmin()){

    alert(
      "শুধু Admin কমেন্ট Delete করতে পারবেন।"
    );

    return;

  }


  if(
    !confirm(
      "এই কমেন্টটি Delete করবেন?"
    )
  ){

    return;

  }


  try{

    const { error } =
      await supabaseClient
        .from("photo_comments")
        .delete()
        .eq(
          "id",
          commentId
        );


    if(error){

      throw error;

    }


    await loadComments(
      fileName
    );


  }catch(error){

    console.error(error);


    alert(
      error.message ||
      "কমেন্ট Delete করা যায়নি।"
    );

  }

}


// ================================
// DELETE PHOTO
// ================================

async function deletePhoto(fileName){

  if(!isAdmin()){

    alert(
      "শুধু Admin ছবি Delete করতে পারবেন।"
    );

    return;

  }


  if(
    !confirm(
      "এই ছবিটি Delete করবেন?"
    )
  ){

    return;

  }


  try{

    const { error:
      storageError
    } =
      await supabaseClient
        .storage
        .from("photos")
        .remove([
          fileName
        ]);


    if(storageError){

      throw storageError;

    }


    const { error:
      commentsError
    } =
      await supabaseClient
        .from("photo_comments")
        .delete()
        .eq(
          "file_name",
          fileName
        );


    if(commentsError){

      throw commentsError;

    }


    const { error:
      postError
    } =
      await supabaseClient
        .from("photo_posts")
        .delete()
        .eq(
          "file_name",
          fileName
        );


    if(postError){

      throw postError;

    }


    localStorage.removeItem(
      likeKey(fileName)
    );


    await loadPhotos();


  }catch(error){

    console.error(error);


    alert(
      error.message ||
      "ছবি Delete করা যায়নি।"
    );

  }

}


// ================================
// FULLSCREEN
// ================================

function openFullscreen(url){

  const box =
    document.getElementById(
      "fullscreen"
    );


  const img =
    document.getElementById(
      "fullscreenImage"
    );


  img.src = url;


  box.classList.remove(
    "hidden"
  );

}


function closeFullscreen(){

  document
    .getElementById(
      "fullscreen"
    )
    .classList.add(
      "hidden"
    );

}


// ================================
// ESCAPE HELPERS
// ================================

function escapeHtml(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeJs(value){

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );

}


function escapeId(value){

  return String(value)
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

}


// ================================
// ESC KEY
// ================================

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeAdminLogin();

      const fullscreen =
        document.getElementById(
          "fullscreen"
        );

      if(
        fullscreen &&
        !fullscreen.classList.contains(
          "hidden"
        )
      ){

        closeFullscreen();

      }

    }

  }
);

  await restoreAdminSession();
