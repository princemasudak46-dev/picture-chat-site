<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .header {
      background: #0088cc;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    input[type="file"] {
      max-width: 100%;
      margin: 10px 0;
    }

    button {
      background: #0088cc;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #preview {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #posts {
      margin-top: 20px;
    }

    .post {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .post img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    📸 Picture Chat
  </div>

  <div class="container">

    <div class="card">

      <h1>স্বাগতম ❤️</h1>

      <p>
        এখানে আপনি সহজেই ছবি শেয়ার করতে পারবেন।
      </p>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <br>

      <img
        id="preview"
        alt="ছবির প্রিভিউ"
      >

      <br>

      <button id="postButton">
        📤 পোস্ট করুন
      </button>

      <p id="message"></p>

    </div>

    <div id="posts"></div>

    <div class="footer">
      © 2026 Picture Chat
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://syzauwriwjwnlwbcxlnf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o";

    const BUCKET =
      "photos";


    const photoInput =
      document.getElementById("photoInput");

    const preview =
      document.getElementById("preview");

    const postButton =
      document.getElementById("postButton");

    const posts =
      document.getElementById("posts");

    const message =
      document.getElementById("message");


    let selectedFile = null;


    // ছবি নির্বাচন
    photoInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;

      const reader = new FileReader();

      reader.onload = function (event) {

        preview.src = event.target.result;

        preview.style.display = "block";

        message.innerText =
          "✅ ছবি প্রস্তুত। এখন পোস্ট করুন।";

      };

      reader.readAsDataURL(file);

    });


    // Supabase থেকে ছবির তালিকা
    async function loadPosts() {

      try {

        const response = await fetch(
          SUPABASE_URL +
          "/storage/v1/object/list/" +
          BUCKET,
          {
            method: "POST",

            headers: {
              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              prefix: "",
              limit: 100,
              sortBy: {
                column: "created_at",
                order: "desc"
              }
            })
          }
        );


        if (!response.ok) {

          console.log(
            "List error:",
            await response.text()
          );

          return;
        }


        const data =
          await response.json();


        posts.innerHTML = "";


        data.forEach(function (file) {

          if (!file.name) {
            return;
          }


          const imageUrl =
            SUPABASE_URL +
            "/storage/v1/object/public/" +
            BUCKET +
            "/" +
            encodeURIComponent(file.name);


          const post =
            document.createElement("div");

          post.className = "post";


          const image =
            document.createElement("img");

          image.src = imageUrl;

          image.loading = "lazy";

          image.alt =
            "Shared photo";


          post.appendChild(image);

          posts.appendChild(post);

        });

      } catch (error) {

        console.log(
          "Load error:",
          error
        );

      }

    }


    // ছবি পোস্ট
    postButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {

          message.innerText =
            "⚠️ আগে একটি ছবি নির্বাচন করুন।";

          return;
        }


        postButton.disabled = true;

        message.innerText =
          "⏳ ছবি আপলোড হচ্ছে...";


        try {

          const safeFileName =
            selectedFile.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const fileName =
            Date.now() +
            "-" +
            safeFileName;


          const uploadUrl =
            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET +
            "/" +
            encodeURIComponent(fileName);


          const response =
            await fetch(
              uploadUrl,
              {
                method: "POST",

                headers: {
                  "Authorization":
                    "Bearer " + SUPABASE_KEY,

                  "apikey":
                    SUPABASE_KEY,

                  "Content-Type":
                    selectedFile.type ||
                    "application/octet-stream"
                },

                body: selectedFile
              }
            );


          if (!response.ok) {

            const errorText =
              await response.text();

            throw new Error(
              errorText ||
              "Upload failed"
            );

          }


          message.innerText =
            "🎉 ছবি সফলভাবে পোস্ট হয়েছে!";


          selectedFile = null;

          photoInput.value = "";

          preview.src = "";

          preview.style.display =
            "none";


          postButton.disabled = false;


          await loadPosts();


        } catch (error) {

          console.log(
            "Upload error:",
            error
          );

          message.innerText =
            "❌ আপলোড হয়নি: " +
            error.message;


          postButton.disabled = false;

        }

      }
    );


    // ওয়েবসাইট চালু হলে ছবি দেখাবে
    loadPosts();

  </script>

</body>
</html>
