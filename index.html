<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Picture Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#29230d 0%,#0b0b0b 40%,#050505 100%);
  color:#fff;
  min-height:100vh;
}

header{
  text-align:center;
  padding:25px 15px 15px;
}

header h1{
  margin:0;
  font-size:30px;
  color:#f5c542;
  text-shadow:0 0 15px rgba(245,197,66,.35);
}

header p{
  margin:7px 0 0;
  color:#aaa;
  font-size:14px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:rgba(20,20,20,.92);
  border:1px solid rgba(245,197,66,.25);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.card-title{
  color:#f5c542;
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

input[type="file"]{
  width:100%;
  padding:12px;
  background:#111;
  color:#ddd;
  border:1px solid #333;
  border-radius:12px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:10px 15px;
  font-weight:bold;
}

.primary-btn{
  width:100%;
  margin-top:12px;
  background:linear-gradient(135deg,#f5c542,#b8860b);
  color:#000;
}

.primary-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.admin-btn{
  background:#191919;
  color:#f5c542;
  border:1px solid #8c6b18;
}

.logout-btn{
  background:#351313;
  color:#ff7777;
  border:1px solid #632626;
}

.admin-box{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}

.admin-status{
  color:#aaa;
  font-size:13px;
}

.preview{
  display:none;
  margin-top:12px;
}

.preview img{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:14px;
  background:#050505;
}

.login-panel{
  display:none;
  margin-top:15px;
}

.login-panel input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border-radius:9px;
  border:1px solid #333;
  background:#0b0b0b;
  color:#fff;
}

.login-submit{
  width:100%;
  background:#f5c542;
  color:#000;
}

.close-login{
  width:100%;
  margin-top:7px;
  background:#222;
  color:#aaa;
}

.posts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.post{
  background:#111;
  border:1px solid rgba(245,197,66,.2);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.post-image{
  position:relative;
  background:#050505;
  cursor:pointer;
}

.post-image img{
  display:block;
  width:100%;
  height:320px;
  object-fit:cover;
}

.post-info{
  padding:14px;
}

.owner{
  color:#f5c542;
  font-size:13px;
  margin-bottom:10px;
}

.owner.guest{
  color:#bbb;
}

.actions{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.like-btn,
.comment-btn{
  flex:1;
  background:#1b1b1b;
  color:#fff;
  border:1px solid #333;
}

.like-btn:hover,
.comment-btn:hover{
  border-color:#f5c542;
}

.comments{
  margin-top:12px;
}

.comment{
  background:#181818;
  border-radius:10px;
  padding:9px;
  margin-top:7px;
  font-size:13px;
}

.comment-user{
  color:#f5c542;
  font-weight:bold;
  margin-bottom:4px;
}

.comment-text{
  color:#ddd;
  word-break:break-word;
}

.comment-date{
  color:#666;
  font-size:10px;
  margin-top:4px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  min-width:0;
  padding:10px;
  border-radius:9px;
  border:1px solid #333;
  background:#0b0b0b;
  color:#fff;
  outline:none;
}

.comment-send{
  background:#f5c542;
  color:#000;
}

.delete-btn{
  width:100%;
  margin-top:10px;
  background:#321313;
  color:#ff7777;
  border:1px solid #642727;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:25px;
}

.public-note{
  text-align:center;
  color:#888;
  font-size:13px;
  padding:5px;
}

.viewer{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.95);
  align-items:center;
  justify-content:center;
}

.viewer img{
  max-width:95%;
  max-height:90%;
  object-fit:contain;
}

.viewer-close{
  position:absolute;
  top:18px;
  right:20px;
  color:#fff;
  font-size:32px;
  cursor:pointer;
}

.viewer-prev,
.viewer-next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:25px;
  width:45px;
  height:45px;
  border-radius:50%;
}

.viewer-prev{
  left:15px;
}

.viewer-next{
  right:15px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#171717;
  color:#fff;
  border:1px solid #444;
  border-radius:10px;
  padding:12px 18px;
  display:none;
  z-index:10000;
  max-width:90%;
  text-align:center;
}

@media(max-width:600px){

  header h1{
    font-size:25px;
  }

  .post-image img{
    height:280px;
  }

  .container{
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📸 Picture Chat</h1>
  <p>Premium Photo Sharing</p>
</header>

<div class="container">

  <!-- ADMIN PANEL -->
  <div class="card">

    <div class="card-title">
      🔐 Admin
    </div>

    <div class="admin-box">

      <button
        class="admin-btn"
        id="loginBtn"
        onclick="openLogin()"
      >
        🔐 Admin Login
      </button>

      <button
        class="logout-btn"
        id="logoutBtn"
        onclick="logoutAdmin()"
        style="display:none"
      >
        🚪 Logout
      </button>

      <div
        class="admin-status"
        id="adminStatus"
      >
        Public Viewer Mode
      </div>

    </div>

    <div
      class="login-panel"
      id="loginPanel"
    >

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
      >

      <button
        class="login-submit"
        onclick="loginAdmin()"
      >
        🔐 Login
      </button>

      <button
        class="close-login"
        onclick="closeLogin()"
      >
        বন্ধ করুন
      </button>

    </div>

  </div>


  <!-- ADMIN ONLY UPLOAD -->
  <div
    class="card"
    id="uploadCard"
    style="display:none"
  >

    <div class="card-title">
      📤 ছবি শেয়ার করুন
    </div>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <div
      class="preview"
      id="previewBox"
    >
      <img
        id="previewImage"
        alt="Preview"
      >
    </div>

    <button
      class="primary-btn"
      id="postBtn"
      disabled
    >
      📸 পোস্ট করুন
    </button>

  </div>


  <div
    class="public-note"
    id="publicNote"
  >
    👀 ছবি দেখুন • ❤️ Like দিন • 💬 Comment করুন
  </div>


  <!-- POSTS -->
  <div class="card">

    <div class="card-title">
      🖼️ Shared Photos
    </div>

    <div
      id="posts"
      class="posts"
    >
      <div class="loading">
        ছবি লোড হচ্ছে...
      </div>
    </div>

  </div>

</div>


<!-- IMAGE VIEWER -->
<div
  class="viewer"
  id="viewer"
>

  <div
    class="viewer-close"
    onclick="closeViewer()"
  >
    ×
  </div>

  <button
    class="viewer-prev"
    onclick="viewerPrev()"
  >
    ‹
  </button>

  <img
    id="viewerImage"
    alt="Full Image"
  >

  <button
    class="viewer-next"
    onclick="viewerNext()"
  >
    ›
  </button>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

const SUPABASE_URL =
  "https://syzauwriwjwnlwbcxlnf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const BUCKET = "photos";

const ADMIN_UID =
  "e482b1f1-03fb-4a36-9412-af71f89cb31d";

const ADMIN_ACCESS_KEY =
  "picture_chat_admin_access_token";

const ADMIN_REFRESH_KEY =
  "picture_chat_admin_refresh_token";

let selectedFile = null;

let postsData = [];

let viewerIndex = 0;


/* =========================
   HELPERS
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  },2500);
}


function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   GUEST NAME
========================= */

function getGuestName(){

  let name =
    localStorage.getItem(
      "picture_chat_guest_name"
    );

  if(!name){

    const number =
      Math.floor(
        1000 +
        Math.random() * 9000
      );

    name =
      "Guest-" + number;

    localStorage.setItem(
      "picture_chat_guest_name",
      name
    );
  }

  return name;
}


/* =========================
   ADMIN
========================= */

function getAdminAccessToken(){

  return localStorage.getItem(
    ADMIN_ACCESS_KEY
  );
}


function isAdmin(){

  return !!getAdminAccessToken();
}


function getCurrentUserId(){

  return isAdmin()
    ? ADMIN_UID
    : null;
}


function getCurrentUserName(){

  return isAdmin()
    ? "Admin"
    : getGuestName();
}


/* =========================
   RESTORE ADMIN SESSION
========================= */

async function restoreAdminSession(){

  const accessToken =
    localStorage.getItem(
      ADMIN_ACCESS_KEY
    );

  const refreshToken =
    localStorage.getItem(
      ADMIN_REFRESH_KEY
    );


  if(
    !accessToken ||
    !refreshToken
  ){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.auth.setSession({
    access_token:accessToken,
    refresh_token:refreshToken
  });


  if(error || !data?.session){

    localStorage.removeItem(
      ADMIN_ACCESS_KEY
    );

    localStorage.removeItem(
      ADMIN_REFRESH_KEY
    );

    return;
  }


  if(data.user?.id !== ADMIN_UID){

    await supabaseClient.auth.signOut();

    localStorage.removeItem(
      ADMIN_ACCESS_KEY
    );

    localStorage.removeItem(
      ADMIN_REFRESH_KEY
    );
  }

}


/* =========================
   ADMIN UI
========================= */

function updateAdminUI(){

  const loggedIn =
    isAdmin();


  document.getElementById(
    "loginBtn"
  ).style.display =
    loggedIn
      ? "none"
      : "inline-block";


  document.getElementById(
    "logoutBtn"
  ).style.display =
    loggedIn
      ? "inline-block"
      : "none";


  document.getElementById(
    "uploadCard"
  ).style.display =
    loggedIn
      ? "block"
      : "none";


  document.getElementById(
    "publicNote"
  ).style.display =
    loggedIn
      ? "none"
      : "block";


  document.getElementById(
    "adminStatus"
  ).textContent =
    loggedIn
      ? "👑 Admin হিসেবে লগইন করা আছে"
      : "Public Viewer Mode";
}


function openLogin(){

  document.getElementById(
    "loginPanel"
  ).style.display =
    "block";
}


function closeLogin(){

  document.getElementById(
    "loginPanel"
  ).style.display =
    "none";
}


/* =========================
   LOGIN
========================= */

async function loginAdmin(){

  const email =
    document.getElementById(
      "adminEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "adminPassword"
    ).value;


  if(
    !email ||
    !password
  ){

    showToast(
      "Email এবং Password দিন"
    );

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.auth
    .signInWithPassword({
      email,
      password
    });


  if(error){

    showToast(
      "Login failed: " +
      error.message
    );

    return;
  }


  if(
    !data?.session ||
    !data?.user
  ){

    showToast(
      "Login session পাওয়া যায়নি"
    );

    return;
  }


  if(
    data.user.id !== ADMIN_UID
  ){

    await supabaseClient.auth.signOut();

    showToast(
      "এই account Admin নয়"
    );

    return;
  }


  localStorage.setItem(
    ADMIN_ACCESS_KEY,
    data.session.access_token
  );

  localStorage.setItem(
    ADMIN_REFRESH_KEY,
    data.session.refresh_token
  );


  closeLogin();

  updateAdminUI();

  showToast(
    "👑 Admin Login সফল"
  );


  await loadPosts();
}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  localStorage.removeItem(
    ADMIN_ACCESS_KEY
  );

  localStorage.removeItem(
    ADMIN_REFRESH_KEY
  );

  updateAdminUI();

  showToast(
    "Admin Logout হয়েছে"
  );

  await loadPosts();
}


/* =========================
   FILE SELECT
========================= */

document
.getElementById("photoInput")
.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){

      selectedFile = null;

      document.getElementById(
        "previewBox"
      ).style.display =
        "none";

      document.getElementById(
        "postBtn"
      ).disabled =
        true;

      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      showToast(
        "শুধু Image file দিন"
      );

      this.value = "";

      return;
    }


    if(
      file.size >
      50 * 1024 * 1024
    ){

      showToast(
        "ছবির size 50MB-এর বেশি হতে পারবে না"
      );

      this.value = "";

      return;
    }


    selectedFile = file;


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        document.getElementById(
          "previewImage"
        ).src =
          e.target.result;

        document.getElementById(
          "previewBox"
        ).style.display =
          "block";
      };


    reader.readAsDataURL(file);


    document.getElementById(
      "postBtn"
    ).disabled =
      false;

  }
);


/* =========================
   UPLOAD
========================= */

document
.getElementById("postBtn")
.addEventListener(
  "click",
  uploadPhoto
);


async function uploadPhoto(){

  if(!isAdmin()){

    showToast(
      "Admin Login প্রয়োজন"
    );

    return;
  }


  if(!selectedFile){

    showToast(
      "আগে একটি ছবি নির্বাচন করুন"
    );

    return;
  }


  const postBtn =
    document.getElementById(
      "postBtn"
    );


  postBtn.disabled = true;

  postBtn.textContent =
    "⏳ Upload হচ্ছে...";


  try{

    const extension =
      selectedFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.floor(
        Math.random() * 100000
      ) +
      "." +
      extension;


    const {
      error:uploadError
    } =
    await supabaseClient.storage
      .from(BUCKET)
      .upload(
        fileName,
        selectedFile,
        {
          contentType:
            selectedFile.type,
          upsert:false
        }
      );


    if(uploadError){

      throw uploadError;
    }


    const {
      error:dbError
    } =
    await supabaseClient
      .from("photo_posts")
      .insert({
        file_name:fileName,
        likes:0,
        user_id:ADMIN_UID,
        user_name:"Admin"
      });


    if(dbError){

      await supabaseClient
        .storage
        .from(BUCKET)
        .remove([
          fileName
        ]);

      throw dbError;
    }


    showToast(
      "📸 ছবি সফলভাবে পোস্ট হয়েছে"
    );


    selectedFile = null;


    document.getElementById(
      "photoInput"
    ).value = "";


    document.getElementById(
      "previewBox"
    ).style.display =
      "none";


    await loadPosts();


  }catch(error){

    console.error(error);

    showToast(
      "Upload failed: " +
      error.message
    );

  }finally{

    postBtn.disabled = false;

    postBtn.textContent =
      "📸 পোস্ট করুন";
  }

}


/* =========================
   IMAGE URL
========================= */

function getImageUrl(fileName){

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    encodeURIComponent(
      fileName
    )
  );
}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const postsElement =
    document.getElementById(
      "posts"
    );


  postsElement.innerHTML =
    '<div class="loading">⏳ ছবি লোড হচ্ছে...</div>';


  try{

    const {
      data:files,
      error:fileError
    } =
    await supabaseClient.storage
      .from(BUCKET)
      .list(
        "",
        {
          limit:100,
          sortBy:{
            column:"name",
            order:"desc"
          }
        }
      );


    if(fileError){

      throw fileError;
    }


    const imageFiles =
      (files || []).filter(
        file =>
          /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i
            .test(file.name)
      );


    if(
      imageFiles.length === 0
    ){

      postsElement.innerHTML =
        '<div class="empty">📭 এখনো কোনো ছবি নেই</div>';

      return;
    }


    const postResults =
      await Promise.all(
        imageFiles.map(
          async file => {

            const {
              data,
              error
            } =
            await supabaseClient
              .from("photo_posts")
              .select(
                "id,file_name,likes,user_id,user_name,created_at"
              )
              .eq(
                "file_name",
                file.name
              )
              .maybeSingle();


            if(error){

              console.error(
                error
              );
            }


            return {
              file,
              post:
                data || {
                  file_name:
                    file.name,
                  likes:0,
                  user_id:null,
                  user_name:null,
                  created_at:null
                }
            };

          }
        )
      );


    postsData =
      postResults.map(
        item =>
          item.file.name
      );


    postsElement.innerHTML =
      "";


    postResults.forEach(
      (item,index) => {

        renderPost(
          item.file,
          item.post,
          index
        );

      }
    );


  }catch(error){

    console.error(error);

    postsElement.innerHTML =
      '<div class="empty">❌ ছবি লোড করা যায়নি</div>';
  }

}


/* =========================
   RENDER POST
========================= */

function renderPost(
  file,
  post,
  index
){

  const postsElement =
    document.getElementById(
      "posts"
    );


  const fileName =
    file.name;


  let ownerName =
    post.user_name;


  if(!ownerName){

    if(
      post.user_id ===
      ADMIN_UID
    ){

      ownerName =
        "Admin";

    }else{

      ownerName =
        "Guest";
    }
  }


  const ownerClass =
    ownerName === "Admin"
      ? ""
      : "guest";


  const ownerIcon =
    ownerName === "Admin"
      ? "👑"
      : "👤";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "post";


  div.innerHTML = `

    <div
      class="post-image"
      onclick="openViewer(${index})"
    >

      <img
        src="${getImageUrl(
          fileName
        )}"
        alt="Shared Photo"
        loading="lazy"
      >

    </div>


    <div class="post-info">

      <div class="owner ${ownerClass}">
        ${ownerIcon}
        ${escapeHtml(ownerName)}
      </div>


      <div class="actions">

        <button
          class="like-btn"
          onclick="likePost('${escapeHtml(fileName)}',this)"
        >
          ❤️
          <span>
            ${Number(
              post.likes || 0
            )}
          </span>
        </button>


        <button
          class="comment-btn"
          onclick="focusComment('${escapeHtml(fileName)}')"
        >
          💬 Comment
        </button>

      </div>


      <div
        id="comments-${encodeURIComponent(fileName)}"
        class="comments"
      >
        <div class="loading">
          কমেন্ট লোড হচ্ছে...
        </div>
      </div>


      <div class="comment-form">

        <input
          id="input-${encodeURIComponent(fileName)}"
          class="comment-input"
          type="text"
          placeholder="কমেন্ট লিখুন..."
          maxlength="500"
          onkeydown="commentKey(event,'${escapeHtml(fileName)}')"
        >

        <button
          class="comment-send"
          onclick="addComment('${escapeHtml(fileName)}')"
        >
          ➤
        </button>

      </div>


      ${
        isAdmin()
        ?
        `
          <button
            class="delete-btn"
            onclick="deletePhoto('${escapeHtml(fileName)}')"
          >
            🗑️ Delete Photo
          </button>
        `
        :
        ""
      }

    </div>

  `;


  postsElement.appendChild(
    div
  );


  loadComments(
    fileName
  );

}


/* =========================
   COMMENTS
========================= */

async function loadComments(
  fileName
){

  const element =
    document.getElementById(
      "comments-" +
      encodeURIComponent(
        fileName
      )
    );


  if(!element){
    return;
  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("photo_comments")
      .select(
        "id,file_name,comment,user_id,user_name,created_at"
      )
      .eq(
        "file_name",
        fileName
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


    if(error){

      throw error;
    }


    if(
      !data ||
      data.length === 0
    ){

      element.innerHTML =
        '<div style="color:#666;font-size:12px">💬 এখনো কোনো কমেন্ট নেই</div>';

      return;
    }


    element.innerHTML =
      "";


    data.forEach(
      comment => {

        let userName =
          comment.user_name;


        let commentText =
          comment.comment;


        if(
          commentText &&
          commentText.includes(
            "|||"
          )
        ){

          const parts =
            commentText.split(
              "|||"
            );


          if(!userName){

            userName =
              parts[0];
          }


          commentText =
            parts
              .slice(1)
              .join("|||");
        }


        if(!userName){

          userName =
            comment.user_id ===
            ADMIN_UID
              ? "Admin"
              : "Guest";
        }


        const commentDiv =
          document.createElement(
            "div"
          );


        commentDiv.className =
          "comment";


        commentDiv.innerHTML = `

          <div class="comment-user">

            ${
              userName === "Admin"
              ? "👑"
              : "👤"
            }

            ${escapeHtml(
              userName
            )}

          </div>


          <div class="comment-text">
            ${escapeHtml(
              commentText
            )}
          </div>


          <div class="comment-date">
            ${formatDate(
              comment.created_at
            )}
          </div>


          ${
            isAdmin()
            ?
            `
              <button
                onclick="deleteComment('${comment.id}')"
                style="
                  margin-top:6px;
                  background:none;
                  border:none;
                  color:#ff7777;
                  padding:0;
                  font-size:11px;
                "
              >
                🗑️ Delete Comment
              </button>
            `
            :
            ""
          }

        `;


        element.appendChild(
          commentDiv
        );

      }
    );


  }catch(error){

    console.error(error);

    element.innerHTML =
      '<div style="color:#777;font-size:12px">কমেন্ট লোড করা যায়নি</div>';
  }

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(
  fileName
){

  const input =
    document.getElementById(
      "input-" +
      encodeURIComponent(
        fileName
      )
    );


  if(!input){
    return;
  }


  const text =
    input.value.trim();


  if(!text){

    showToast(
      "কমেন্ট লিখুন"
    );

    return;
  }


  try{

    const userId =
      getCurrentUserId();


    const userName =
      getCurrentUserName();


    const {
      error
    } =
    await supabaseClient
      .from("photo_comments")
      .insert({
        file_name:
          fileName,
        comment:
          text,
        user_id:
          userId,
        user_name:
          userName
      });


    if(error){

      throw error;
    }


    input.value =
      "";


    await loadComments(
      fileName
    );


  }catch(error){

    console.error(error);

    showToast(
      "Comment failed: " +
      error.message
    );
  }

}


function commentKey(
  event,
  fileName
){

  if(
    event.key ===
    "Enter"
  ){

    event.preventDefault();

    addComment(
      fileName
    );
  }
}


/* =========================
   SECURE LIKE
========================= */

async function likePost(
  fileName,
  button
){

  try{

    button.disabled =
      true;


    const {
      data,
      error
    } =
    await supabaseClient
      .rpc(
        "add_photo_like",
        {
          p_file_name:
            fileName
        }
      );


    if(error){

      throw error;
    }


    const span =
      button.querySelector(
        "span"
      );


    if(span){

      span.textContent =
        Number(data || 0);
    }


  }catch(error){

    console.error(error);

    showToast(
      "Like দেওয়া যায়নি"
    );

  }finally{

    button.disabled =
      false;
  }

}


/* =========================
   DELETE PHOTO
========================= */

async function deletePhoto(
  fileName
){

  if(!isAdmin()){

    showToast(
      "Admin permission প্রয়োজন"
    );

    return;
  }


  if(
    !confirm(
      "এই ছবিটি এবং এর সব কমেন্ট Delete করবেন?"
    )
  ){

    return;
  }


  try{

    const {
      error:storageError
    } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .remove([
        fileName
      ]);


    if(storageError){

      throw storageError;
    }


    const {
      error:commentError
    } =
    await supabaseClient
      .from("photo_comments")
      .delete()
      .eq(
        "file_name",
        fileName
      );


    if(commentError){

      throw commentError;
    }


    const {
      error:postError
    } =
    await supabaseClient
      .from("photo_posts")
      .delete()
      .eq(
        "file_name",
        fileName
      );


    if(postError){

      throw postError;
    }


    showToast(
      "🗑️ ছবি Delete হয়েছে"
    );


    await loadPosts();


  }catch(error){

    console.error(error);

    showToast(
      "Delete failed: " +
      error.message
    );
  }

}


/* =========================
   DELETE COMMENT
========================= */

async function deleteComment(
  commentId
){

  if(!isAdmin()){

    showToast(
      "Admin permission প্রয়োজন"
    );

    return;
  }


  if(
    !confirm(
      "এই কমেন্টটি Delete করবেন?"
    )
  ){

    return;
  }


  try{

    const {
      error
    } =
    await supabaseClient
      .from("photo_comments")
      .delete()
      .eq(
        "id",
        commentId
      );


    if(error){

      throw error;
    }


    showToast(
      "🗑️ Comment Delete হয়েছে"
    );


    await loadPosts();


  }catch(error){

    console.error(error);

    showToast(
      "Comment Delete failed: " +
      error.message
    );
  }

}


/* =========================
   FOCUS COMMENT
========================= */

function focusComment(
  fileName
){

  const input =
    document.getElementById(
      "input-" +
      encodeURIComponent(
        fileName
      )
    );


  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }

}


/* =========================
   DATE
========================= */

function formatDate(
  date
){

  if(!date){
    return "";
  }


  try{

    return new Date(
      date
    ).toLocaleString(
      "bn-BD",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );

  }catch(e){

    return "";
  }

}


/* =========================
   VIEWER
========================= */

function openViewer(
  index
){

  if(
    !postsData ||
    !postsData[index]
  ){

    return;
  }


  viewerIndex =
    index;


  document.getElementById(
    "viewerImage"
  ).src =
    getImageUrl(
      postsData[
        viewerIndex
      ]
    );


  document.getElementById(
    "viewer"
  ).style.display =
    "flex";
}


function closeViewer(){

  document.getElementById(
    "viewer"
  ).style.display =
    "none";
}


function viewerPrev(){

  if(
    !postsData.length
  ){

    return;
  }


  viewerIndex--;


  if(
    viewerIndex < 0
  ){

    viewerIndex =
      postsData.length - 1;
  }


  document.getElementById(
    "viewerImage"
  ).src =
    getImageUrl(
      postsData[
        viewerIndex
      ]
    );
}


function viewerNext(){

  if(
    !postsData.length
  ){

    return;
  }


  viewerIndex++;


  if(
    viewerIndex >=
    postsData.length
  ){

    viewerIndex = 0;
  }


  document.getElementById(
    "viewerImage"
  ).src =
    getImageUrl(
      postsData[
        viewerIndex
      ]
    );
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeViewer();
    }


    if(
      document.getElementById(
        "viewer"
      ).style.display ===
      "flex"
    ){

      if(
        event.key ===
        "ArrowLeft"
      ){

        viewerPrev();
      }


      if(
        event.key ===
        "ArrowRight"
      ){

        viewerNext();
      }
    }

  }
);


/* =========================
   START
========================= */

async function init(){

  await restoreAdminSession();

  updateAdminUI();

  await loadPosts();

}


init();
