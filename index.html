<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .header {
      background: #0088cc;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    button {
      background: #0088cc;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #006fa6;
    }

    #preview {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #posts {
      margin-top: 20px;
    }

    .post {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .post img {
      width: 100%;
      border-radius: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    📸 Picture Chat
  </div>

  <div class="container">

    <div class="card">
      <h1>স্বাগতম ❤️</h1>

      <p>
        এখানে আপনি সহজেই ছবি শেয়ার করতে পারবেন।
      </p>

      <input type="file" id="photoInput" accept="image/*">

      <br>

      <img id="preview" alt="ছবির প্রিভিউ">

      <br>

      <button id="postButton">
        📤 পোস্ট করুন
      </button>

      <p id="message"></p>
    </div>

    <div id="posts"></div>

    <div class="footer">
      © 2026 Picture Chat
    </div>

  </div>

  <script>
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const postButton = document.getElementById("postButton");
    const posts = document.getElementById("posts");
    const message = document.getElementById("message");

    let selectedImage = "";

    photoInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        selectedImage = event.target.result;

        preview.src = selectedImage;
        preview.style.display = "block";
        message.innerText = "✅ ছবি প্রস্তুত। এখন পোস্ট করুন।";
      };

      reader.readAsDataURL(file);
    });

    postButton.addEventListener("click", function () {
      if (!selectedImage) {
        message.innerText = "⚠️ আগে একটি ছবি নির্বাচন করুন।";
        return;
      }

      const post = document.createElement("div");
      post.className = "post";

      const image = document.createElement("img");
      image.src = selectedImage;

      post.appendChild(image);
      posts.prepend(post);

      message.innerText = "🎉 ছবি সফলভাবে পোস্ট হয়েছে!";

      photoInput.value = "";
      selectedImage = "";
      preview.style.display = "none";
    });
  </script>

</body>
</html>
