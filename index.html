<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .header {
      background: #0088cc;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card,
    .post {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .card {
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    input[type="file"] {
      max-width: 100%;
      margin: 10px 0;
    }

    button {
      background: #0088cc;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #preview {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #posts {
      margin-top: 20px;
    }

    .post {
      padding: 15px;
      margin-top: 15px;
    }

    .post img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      background: #eee;
    }

    .like-button {
      width: 100%;
      background: #ff4d6d;
      margin-top: 12px;
    }

    .like-count {
      text-align: center;
      margin-top: 8px;
      color: #555;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    📸 Picture Chat
  </div>

  <div class="container">

    <div class="card">

      <h1>স্বাগতম ❤️</h1>

      <p>
        এখানে আপনি সহজেই ছবি শেয়ার করতে পারবেন।
      </p>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <br>

      <img id="preview" alt="ছবির প্রিভিউ">

      <br>

      <button id="postButton">
        📤 পোস্ট করুন
      </button>

      <p id="message"></p>

    </div>

    <div id="posts"></div>

    <div class="footer">
      © 2026 Picture Chat
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>

    const supabase = window.supabase.createClient(
      "https://syzauwriwjwnlwbcxlnf.supabase.co",
      "sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o"
    );

    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const postButton = document.getElementById("postButton");
    const posts = document.getElementById("posts");
    const message = document.getElementById("message");

    let selectedFile = null;


    /* =========================
       ছবি নির্বাচন
    ========================= */

    photoInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;

      const reader = new FileReader();

      reader.onload = function (event) {

        preview.src = event.target.result;
        preview.style.display = "block";

        message.innerText =
          "✅ ছবি প্রস্তুত। এখন পোস্ট করুন।";
      };

      reader.readAsDataURL(file);

    });


    /* =========================
       ছবি লোড
    ========================= */

    async function loadPosts() {

      posts.innerHTML =
        "<p style='text-align:center;'>⏳ ছবি লোড হচ্ছে...</p>";


      const result = await supabase.storage
        .from("photos")
        .list("", {
          limit: 100,
          sortBy: {
            column: "created_at",
            order: "desc"
          }
        });


      const files = result.data;
      const error = result.error;


      if (error) {

        console.log("Storage error:", error);

        posts.innerHTML =
          "<p style='text-align:center;color:red;'>❌ ছবি লোড হয়নি</p>";

        return;
      }


      posts.innerHTML = "";


      if (!files || files.length === 0) {

        posts.innerHTML =
          "<p style='text-align:center;'>এখনও কোনো ছবি নেই।</p>";

        return;
      }


      for (const file of files) {

        if (!file.name) {
          continue;
        }


        const publicUrl =
          supabase.storage
            .from("photos")
            .getPublicUrl(file.name)
            .data.publicUrl;


        let likes = 0;
        let postId = null;


        const dbResult =
          await supabase
            .from("photo_posts")
            .select("id, likes")
            .eq("file_name", file.name)
            .maybeSingle();


        if (dbResult.data) {

          postId = dbResult.data.id;
          likes = dbResult.data.likes || 0;

        }


        const post =
          document.createElement("div");

        post.className = "post";


        const image =
          document.createElement("img");

        image.src = publicUrl;
        image.alt = "Shared photo";
        image.loading = "lazy";


        image.onerror = function () {

          image.style.display = "none";

        };


        const likeButton =
          document.createElement("button");

        likeButton.className = "like-button";

        likeButton.innerText =
          "❤️ Like";


        const likeCount =
          document.createElement("div");

        likeCount.className = "like-count";

        likeCount.innerText =
          "❤️ " + likes + " Likes";


        likeButton.addEventListener(
          "click",
          async function () {

            likeButton.disabled = true;


            const newLikes = likes + 1;


            if (!postId) {

              const insertResult =
                await supabase
                  .from("photo_posts")
                  .insert({
                    file_name: file.name,
                    likes: 1
                  })
                  .select("id, likes")
                  .single();


              if (insertResult.error) {

                console.log(
                  "Like error:",
                  insertResult.error
                );

                likeButton.disabled = false;

                return;
              }


              postId = insertResult.data.id;

            } else {

              const updateResult =
                await supabase
                  .from("photo_posts")
                  .update({
                    likes: newLikes
                  })
                  .eq("id", postId);


              if (updateResult.error) {

                console.log(
                  "Like update error:",
                  updateResult.error
                );

                likeButton.disabled = false;

                return;
              }

            }


            likes = newLikes;

            likeCount.innerText =
              "❤️ " + likes + " Likes";

            likeButton.disabled = false;

          }
        );


        post.appendChild(image);
        post.appendChild(likeButton);
        post.appendChild(likeCount);

        posts.appendChild(post);

      }

    }


    /* =========================
       নতুন ছবি পোস্ট
    ========================= */

    postButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {

          message.innerText =
            "⚠️ আগে একটি ছবি নির্বাচন করুন।";

          return;
        }


        postButton.disabled = true;

        message.innerText =
          "⏳ ছবি আপলোড হচ্ছে...";


        const safeFileName =
          selectedFile.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const fileName =
          Date.now() + "-" + safeFileName;


        const uploadResult =
          await supabase.storage
            .from("photos")
            .upload(
              fileName,
              selectedFile,
              {
                cacheControl: "3600",
                upsert: false,
                contentType: selectedFile.type
              }
            );


        if (uploadResult.error) {

          console.log(
            "Upload error:",
            uploadResult.error
          );

          message.innerText =
            "❌ আপলোড হয়নি: " +
            uploadResult.error.message;

          postButton.disabled = false;

          return;
        }


        const dbResult =
          await supabase
            .from("photo_posts")
            .insert({
              file_name: fileName,
              likes: 0
            });


        if (dbResult.error) {

          console.log(
            "Database error:",
            dbResult.error
          );

        }


        message.innerText =
          "🎉 ছবি সফলভাবে পোস্ট হয়েছে!";


        selectedFile = null;

        photoInput.value = "";

        preview.src = "";

        preview.style.display = "none";

        postButton.disabled = false;


        await loadPosts();

      }
    );


    /* =========================
       ওয়েবসাইট চালু হলে
    ========================= */

    loadPosts();

  </script>

</body>
</html>
