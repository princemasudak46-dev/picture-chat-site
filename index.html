const BUCKET =
"photos";

const ADMIN_UID =
"e482b1f1-03fb-4a36-9412-af71f89cb31d";


const photoInput =

let selectedFile = null;

let viewerImages = [];

let viewerIndex = 0;


/* =====================================
   ADMIN SESSION
===================================== */

let adminAccessToken =
localStorage.getItem(
  "picture_chat_admin_access_token"
) || null;

let adminRefreshToken =
localStorage.getItem(
  "picture_chat_admin_refresh_token"
) || null;


/* =====================================
   SAVE ADMIN SESSION
===================================== */

function saveAdminSession(data){

  adminAccessToken =
  data.access_token || null;

  adminRefreshToken =
  data.refresh_token || adminRefreshToken || null;

  if(adminAccessToken){

    localStorage.setItem(
      "picture_chat_admin_access_token",
      adminAccessToken
    );

  }

  if(adminRefreshToken){

    localStorage.setItem(
      "picture_chat_admin_refresh_token",
      adminRefreshToken
    );

  }

}


/* =====================================
   CLEAR ADMIN SESSION
===================================== */

function clearAdminSession(){

  adminAccessToken = null;
  adminRefreshToken = null;

  localStorage.removeItem(
    "picture_chat_admin_access_token"
  );

  localStorage.removeItem(
    "picture_chat_admin_refresh_token"
  );

}


/* =====================================
   REFRESH SUPABASE SESSION
===================================== */

async function refreshAdminSession(){

  if(!adminRefreshToken){
    return false;
  }

  try{

    const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=refresh_token",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          refresh_token:
          adminRefreshToken
        })
      }
    );

    const data =
    await response.json();

    if(!response.ok){

      clearAdminSession();

      return false;
    }

    if(!data.user ||
       data.user.id !== ADMIN_UID){

      clearAdminSession();

      return false;
    }

    saveAdminSession(data);

    return true;

  }catch(error){

    console.log(
      "Session refresh error:",
      error
    );

    return false;
  }

}


/* =====================================
   SHOW ADMIN UI
===================================== */

function showAdminUI(){

  adminStatus.innerText =
  "✅ Admin Login চালু আছে।";

  adminStatus.style.color =
  "#7cff9b";

  adminLoginButton.style.display =
  "none";

  adminLogoutButton.style.display =
  "block";

  document

    btn.style.display="block";

  .querySelectorAll(".deleteComment")

}


/* =====================================
   HIDE ADMIN UI
===================================== */

function hideAdminUI(){

  adminStatus.innerText =

  adminStatus.style.color =

}


/* =====================================
   CHECK SAVED LOGIN
===================================== */

async function restoreAdminSession(){

  if(adminAccessToken){

    try{

      const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
            "Bearer " +
            adminAccessToken
          }
        }
      );

      if(response.ok){

        const user =
        await response.json();

        if(user.id === ADMIN_UID){

          showAdminUI();

          return true;
        }

      }

    }catch(error){

      console.log(
        "Saved session check:",
        error
      );

    }

  }

  if(await refreshAdminSession()){

    showAdminUI();

    return true;
  }

  hideAdminUI();

  return false;

}


/* =====================================
   GUEST NAME
===================================== */

function getGuestName(){

  let name =
  localStorage.getItem(
    "picture_chat_guest_name"
  );

  if(!name){

    name =
    "Guest-" +
    Math.floor(
      1000 +
      Math.random()*9000
    );

    localStorage.setItem(
      "picture_chat_guest_name",
      name
    );

  }

  return name;
}


/* =====================================
   TIME
===================================== */

function formatTime(dateString){

  const date =
  new Date(dateString);

  const now =
  new Date();

  const seconds =
  Math.floor(
    (now-date)/1000
  );

  if(seconds<60)
    return "এইমাত্র";

  const minutes =
  Math.floor(seconds/60);

  if(minutes<60)
    return minutes+" মিনিট আগে";

  const hours =
  Math.floor(minutes/60);

  if(hours<24)
    return hours+" ঘণ্টা আগে";

  const days =
  Math.floor(hours/24);

  if(days<7)
    return days+" দিন আগে";

  return date.toLocaleDateString(
    "bn-BD"
  );
}


/* =====================================
   ADMIN LOGIN
===================================== */

adminLoginButton.onclick =
async function(){

  const email =
  adminEmail.value.trim();

  const password =
  adminPassword.value;

  if(!email || !password){

    adminStatus.innerText =
    "⚠️ Email এবং Password দিন।";

    return;
  }

  adminLoginButton.disabled =
  true;

  adminLoginButton.innerText =

  try{

    const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const data =
    await response.json();

    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        "Login failed"
      );

    }

    if(
      !data.user ||
      data.user.id !== ADMIN_UID
    ){

      throw new Error(
        "এই Email Admin নয়।"
      );

    }

    saveAdminSession(data);

    adminEmail.value="";
    adminPassword.value="";

    showAdminUI();

  }catch(error){

    console.log(
      "Admin login error:",
      error
    );

    adminStatus.innerText =
    "❌ Login হয়নি: " +
    error.message;

    adminStatus.style.color =
    "#ff7777";

  }finally{

    adminLoginButton.disabled =
    false;

    adminLoginButton.innerText =
    "🔐 Admin Login";

  }

};


/* =====================================
   ADMIN LOGOUT
===================================== */

adminLogoutButton.onclick =
function(){

  clearAdminSession();

  hideAdminUI();

/* =====================================
   PREVIEW
===================================== */

photoInput.onchange =
function(){

  const file =
  this.files[0];

  if(!file)
    return;

  selectedFile =
  file;

  const reader =

  reader.onload =

};


/* =====================================
   FULLSCREEN
===================================== */

function openViewer(index){

  viewerIndex =
  index;

  viewerImage.src =
  viewerImages[
    viewerIndex
  ];

  imageViewer.classList.add(
    "active"
  );

  document.body.style.overflow =
  "hidden";
}


function closeImageViewer(){

  imageViewer.classList.remove(
    "active"
  );

  document.body.style.overflow =
  "";

  viewerImage.src =
  "";
}


function showNext(){

  if(!viewerImages.length)
    return;

  viewerIndex =
  (viewerIndex+1) %
  viewerImages.length;

  viewerImage.src =
  viewerImages[
    viewerIndex
  ];
}


function showPrev(){

  if(!viewerImages.length)
    return;

  viewerIndex =
  (viewerIndex-1+
  viewerImages.length) %
  viewerImages.length;

  viewerImage.src =
  viewerImages[
    viewerIndex
  ];
}


closeViewer.onclick =
closeImageViewer;

nextBtn.onclick =
showNext;

prevBtn.onclick =
showPrev;


imageViewer.onclick =
function(e){

  if(e.target === imageViewer){

    closeImageViewer();

  }

};


document.onkeydown =
function(e){

  if(e.key==="Escape")
    closeImageViewer();

  if(e.key==="ArrowRight")
    showNext();

  if(e.key==="ArrowLeft")
    showPrev();

};


/* =====================================
   DELETE PHOTO
===================================== */

async function deletePhoto(
  fileName,
  post
){

  if(!adminAccessToken){

    const refreshed =
    await refreshAdminSession();

    if(!refreshed){

      alert(
        "🔐 Admin Login প্রয়োজন।"
      );

      return;
    }

    showAdminUI();
  }

  if(!confirm(
    "এই ছবিটি কি মুছে ফেলবেন?"
  ))
    return;

  try{

    const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      encodeURIComponent(
        fileName
      ),
      {
        method:"DELETE",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
          "Bearer " +
          adminAccessToken
        }
      }
    );

    if(
      response.status === 401
    ){

      if(
        await refreshAdminSession()
      ){

        return deletePhoto(
          fileName,
          post
        );

      }

    }

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    await fetch(
      SUPABASE_URL +
      "/rest/v1/photo_posts" +
      "?file_name=eq." +
      encodeURIComponent(
        fileName
      ),
      {
        method:"DELETE",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          adminAccessToken,

          "Prefer":
          "return=minimal"
        }
      }
    );


    await fetch(
      SUPABASE_URL +
      "/rest/v1/photo_comments" +
      "?file_name=eq." +
      encodeURIComponent(
        fileName
      ),
      {
        method:"DELETE",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          adminAccessToken,

          "Prefer":
          "return=minimal"
        }
      }
    );


    post.remove();

    alert(
      "✅ ছবি সফলভাবে মুছে গেছে।"
    );

  }catch(error){

    console.log(
      "Delete photo error:",
      error
    );

    alert(
      "❌ ছবি মুছতে সমস্যা হয়েছে।"
    );

  }

}

/* =====================================
   LOAD COMMENTS
===================================== */

async function loadComments(
  fileName,
  commentsList
){

  commentsList.innerHTML =
  "<div class='noComments'>⏳ Comment লোড হচ্ছে...</div>";

  try{

    const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/photo_comments" +
      "?select=id,comment,created_at" +
      "&file_name=eq." +
      encodeURIComponent(fileName) +
      "&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    const comments =
    await response.json();

    commentsList.innerHTML =
    "";

    if(!comments.length){

      commentsList.innerHTML =
      "<div class='noComments'>এখনও কোনো Comment নেই।</div>";

      return;
    }


    comments.forEach(
    item=>{

      const div =
      document.createElement(
        "div"
      );

      div.className =
      "commentItem";


      const parts =
      item.comment.split(
        "|||"
      );


      const name =
      parts.length>=2
      ? parts[0]
      : "Guest";


      const text =
      parts.length>=2
      ? parts.slice(1).join("|||")
      : item.comment;


      const header =
      document.createElement(
        "div"
      );

      header.className =
      "commentHeader";


      const user =
      document.createElement(
        "div"
      );

      user.className =
      "commentName";

      user.innerText =
      "👤 " + name;


      const time =
      document.createElement(
        "div"
      );

      time.className =
      "commentTime";

      time.innerText =
      formatTime(
        item.created_at
      );


      header.appendChild(user);
      header.appendChild(time);


      const commentText =
      document.createElement(
        "div"
      );

      commentText.className =
      "commentText";

      commentText.innerText =
      "💬 " + text;


      const deleteBtn =
      document.createElement(
        "button"
      );

      deleteBtn.className =
      "deleteComment";

      deleteBtn.innerText =
      "🗑️ Delete Comment";


      if(!adminAccessToken){

        deleteBtn.style.display =
        "none";

      }


      deleteBtn.onclick =
      function(){

        deleteComment(
          item.id,
          div
        );

      };


      div.appendChild(header);
      div.appendChild(commentText);
      div.appendChild(deleteBtn);

      commentsList.appendChild(div);

    });


  }catch(error){

    console.log(
      "Comment load error:",
      error
    );

    commentsList.innerHTML =
    "<div class='noComments'>❌ Comment লোড হয়নি</div>";

  }

}


/* =====================================
   LOAD POSTS
===================================== */

async function loadPosts(){

  posts.innerHTML =
  "<p style='text-align:center;color:#aaa'>⏳ ছবি লোড হচ্ছে...</p>";

  try{

    const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/list/" +
      BUCKET,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY,

          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          prefix:"",

          limit:100,

          sortBy:{
            column:"created_at",
            order:"desc"
          }

        })
      }
    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const files =
    await response.json();


    posts.innerHTML =
    "";

    viewerImages =
    [];


    const validFiles =
    files.filter(
      file=>file.name
    );


    validFiles.forEach(
    file=>{

      viewerImages.push(

        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        encodeURIComponent(
          file.name
        )

      );

    });


    for(
      let i=0;
      i<validFiles.length;
      i++
    ){

      const file =
      validFiles[i];

      const imageUrl =
      viewerImages[i];


      let likes =
      0;


      try{

        const likeResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/photo_posts" +
          "?select=likes" +
          "&file_name=eq." +
          encodeURIComponent(
            file.name
          ),
          {
            headers:{
              "apikey":SUPABASE_KEY,

              "Authorization":
              "Bearer " +
              SUPABASE_KEY
            }
          }
        );


        if(likeResponse.ok){

          const data =
          await likeResponse.json();

          if(data.length){

            likes =
            Number(
              data[0].likes || 0
            );

          }

        }

      }catch(e){}


      const post =
      document.createElement(
        "div"
      );

      post.className =
      "post";


      const imageWrap =
      document.createElement(
        "div"
      );

      imageWrap.className =
      "postImageWrap";


      const image =
      document.createElement(
        "img"
      );

      image.src =
      imageUrl;

      image.alt =
      "Shared photo";

      image.loading =
      "lazy";


      image.onclick =
      function(){

        openViewer(i);

      };


      imageWrap.appendChild(
        image
      );


      /* DELETE PHOTO */

      const deletePhotoBtn =
      document.createElement(
        "button"
      );

      deletePhotoBtn.className =
      "deletePhoto";

      deletePhotoBtn.innerText =
      "🗑️ Delete";


      if(!adminAccessToken){

        deletePhotoBtn.style.display =
        "none";

      }


      deletePhotoBtn.onclick =
      function(){

        deletePhoto(
          file.name,
          post
        );

      };


      imageWrap.appendChild(
        deletePhotoBtn
      );


      /* LIKE */

      const likeButton =
      document.createElement(
        "button"
      );

      likeButton.className =
      "likeButton";

      likeButton.innerText =
      "❤️ Like";


      const likeCount =
      document.createElement(
        "div"
      );

      likeCount.className =
      "likeCount";

      likeCount.innerText =
      "❤️ " +
      likes +
      " Likes";


      likeButton.onclick =
      async function(){

        likeButton.disabled =
        true;

        likeButton.innerText =
        "⏳ Like হচ্ছে...";


        try{

          const r =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/photo_posts" +
            "?file_name=eq." +
            encodeURIComponent(
              file.name
            ),
            {
              method:"PATCH",

              headers:{
                "apikey":SUPABASE_KEY,

                "Authorization":
                "Bearer " +
                SUPABASE_KEY,

                "Content-Type":
                "application/json"
              },

              body:JSON.stringify({
                likes:likes+1
              })
            }
          );


          if(!r.ok)
            throw new Error();


          likes++;


          likeCount.innerText =
          "❤️ " +
          likes +
          " Likes";


          likeButton.innerText =
          "❤️ Liked";


        }catch(e){

          likeButton.innerText =
          "❌ আবার চেষ্টা করুন";

        }


        setTimeout(
        function(){

          likeButton.innerText =
          "❤️ Like";

          likeButton.disabled =
          false;

        },800);

      };


      /* COMMENT */

      const commentBox =
      document.createElement(
        "div"
      );

      commentBox.className =
      "commentBox";


      const top =
      document.createElement(
        "div"
      );

      top.className =
      "commentTop";


      const title =
      document.createElement(
        "div"
      );

      title.className =
      "commentTitle";

      title.innerText =
      "💬 Comments";


      const refresh =
      document.createElement(
        "button"
      );

      refresh.className =
      "refreshComments";

      refresh.innerText =
      "🔄 Refresh";


      const input =
      document.createElement(
        "textarea"
      );

      input.className =
      "commentInput";

      input.placeholder =
      "💬 আপনার Comment লিখুন...";

      input.maxLength =
      500;


      const commentButton =
      document.createElement(
        "button"
      );

      commentButton.className =
      "commentButton";

      commentButton.innerText =
      "💬 Comment করুন";


      const commentsList =
      document.createElement(
        "div"
      );

      commentsList.className =
      "commentsList";


      refresh.onclick =
      function(){

        loadComments(
          file.name,
          commentsList
        );

      };


      commentButton.onclick =
      async function(){

        const text =
        input.value.trim();


        if(!text)
          return;


        commentButton.disabled =
        true;

        commentButton.innerText =
        "⏳ Comment হচ্ছে...";


        try{

          const saved =
          getGuestName() +
          "|||" +
          text;


          const r =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/photo_comments",
            {
              method:"POST",

              headers:{
                "apikey":SUPABASE_KEY,

                "Authorization":
                "Bearer " +
                SUPABASE_KEY,

                "Content-Type":
                "application/json"
              },

              body:JSON.stringify({

                file_name:
                file.name,

                comment:
                saved

              })
            }
          );


          if(!r.ok)
            throw new Error();


          input.value =
          "";


          await loadComments(
            file.name,
            commentsList
          );


        }catch(e){

          alert(
            "❌ Comment পোস্ট হয়নি"
          );

        }


        commentButton.disabled =
        false;

        commentButton.innerText =
        "💬 Comment করুন";

      };


      input.onkeydown =
      function(e){

        if(
          e.key==="Enter" &&
          !e.shiftKey
        ){

          e.preventDefault();

          commentButton.click();

        }

      };


      top.appendChild(title);
      top.appendChild(refresh);


      commentBox.appendChild(top);
      commentBox.appendChild(input);
      commentBox.appendChild(commentButton);
      commentBox.appendChild(commentsList);


      post.appendChild(imageWrap);
      post.appendChild(likeButton);
      post.appendChild(likeCount);
      post.appendChild(commentBox);


      posts.appendChild(post);


      await loadComments(
        file.name,
        commentsList
      );

    }


    if(!validFiles.length){

      posts.innerHTML =
      "<p style='text-align:center;color:#aaa'>এখনও কোনো ছবি নেই।</p>";

    }


  }catch(error){

    console.log(
      "Load error:",
      error
    );


    posts.innerHTML =
    "<p style='text-align:center;color:#ff7777'>❌ ছবি লোড হয়নি</p>";

  }

}


/* =====================================
   UPLOAD
===================================== */

postButton.onclick =
async function(){

  if(!selectedFile){

    message.innerText =
    "⚠️ আগে একটি ছবি নির্বাচন করুন।";

    return;
  }


  postButton.disabled =
  true;

  message.innerText =
  "⏳ ছবি আপলোড হচ্ছে...";


  try{

    const safeName =
    selectedFile.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


    const fileName =
    Date.now() +
    "-" +
    safeName;


    const uploadResponse =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      encodeURIComponent(
        fileName
      ),
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY,

          "Content-Type":
          selectedFile.type ||
          "application/octet-stream"
        },

        body:selectedFile
      }
    );


    if(!uploadResponse.ok){

      throw new Error(
        await uploadResponse.text()
      );

    }


    const dbResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/photo_posts",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY,

          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          file_name:
          fileName,

          likes:0

        })
      }
    );


    if(!dbResponse.ok){

      console.log(
        "Photo database error:",
        await dbResponse.text()
      );

    }


    message.innerText =
    "🎉 ছবি সফলভাবে পোস্ট হয়েছে!";


    selectedFile =
    null;

    photoInput.value =
    "";

    preview.src =
    "";

    preview.style.display =
    "none";


    await loadPosts();


  }catch(error){

    console.log(
      "Upload error:",
      error
    );

    message.innerText =
    "❌ আপলোড হয়নি";

  }


  postButton.disabled =
  false;

};


/* =====================================
   START
===================================== */

async function startApp(){

  await restoreAdminSession();

  await loadPosts();

}

startApp();

</script>
