<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Picture Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #25200f 0%, #0b0b0b 42%, #050505 100%);
      color: #f5f5f5;
      min-height: 100vh;
    }

    .header {
      padding: 24px 15px;
      text-align: center;
      background: rgba(10, 10, 10, 0.92);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #f5d76e;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .subtitle {
      margin-top: 6px;
      color: #aaa;
      font-size: 13px;
    }

    .container {
      max-width: 620px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: linear-gradient(145deg, #181818, #0e0e0e);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .card h1 {
      margin: 0;
      color: #f5d76e;
      font-size: 24px;
    }

    .card p {
      color: #aaa;
      line-height: 1.6;
    }

    /* =========================
       User Name
    ========================= */

    .userNameBox {
      margin-top: 15px;
      padding: 13px;
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 14px;
      background: rgba(212, 175, 55, 0.04);
    }

    .userNameTitle {
      color: #f5d76e;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #userNameInput {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: #0a0a0a;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    #userNameInput:focus {
      border-color: #d4af37;
    }

    #saveNameButton {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #c9a227;
      border-radius: 10px;
      background: #17130a;
      color: #f5d76e;
      font-weight: bold;
      cursor: pointer;
    }

    #saveNameButton:hover {
      background: #211b0c;
    }

    #savedName {
      margin-top: 8px;
      color: #aaa;
      font-size: 13px;
    }

    .fileBox {
      margin-top: 18px;
      padding: 14px;
      border: 1px dashed rgba(212, 175, 55, 0.55);
      border-radius: 14px;
      background: rgba(212, 175, 55, 0.04);
    }

    input[type="file"] {
      width: 100%;
      color: #ddd;
      font-size: 14px;
    }

    input[type="file"]::file-selector-button {
      border: 1px solid #c9a227;
      background: #17130a;
      color: #f5d76e;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-right: 10px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-top: 18px;
      border-radius: 15px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: #050505;
    }

    #postButton {
      width: 100%;
      margin-top: 18px;
      border: 1px solid #d4af37;
      border-radius: 13px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #111;
      background: linear-gradient(135deg, #f5d76e, #c99a18);
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2);
      cursor: pointer;
      transition: 0.2s;
    }

    #postButton:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 25px rgba(212, 175, 55, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    #message {
      min-height: 24px;
      margin-bottom: 0;
      font-size: 14px;
    }

    #posts {
      margin-top: 25px;
    }

    .post {
      background: linear-gradient(145deg, #171717, #0d0d0d);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .post img {
      width: 100%;
      max-height: 650px;
      object-fit: contain;
      border-radius: 13px;
      display: block;
      background: #050505;
    }

    .likeButton {
      width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 12px;
      padding: 12px;
      background: #15120a;
      color: #f5d76e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .likeButton:hover {
      background: #211b0c;
      border-color: #d4af37;
    }

    .likeCount {
      text-align: center;
      margin-top: 9px;
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       Comments
    ========================= */

    .commentBox {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid rgba(212, 175, 55, 0.18);
    }

    .commentTitle {
      color: #f5d76e;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .commentInput {
      width: 100%;
      min-height: 42px;
      resize: vertical;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: #0a0a0a;
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .commentInput:focus {
      border-color: #d4af37;
    }

    .commentButton {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #c9a227;
      border-radius: 10px;
      background: #17130a;
      color: #f5d76e;
      font-weight: bold;
      cursor: pointer;
    }

    .commentButton:hover {
      background: #211b0c;
    }

    .commentsList {
      margin-top: 12px;
    }

    .commentItem {
      background: #101010;
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-radius: 10px;
      padding: 10px 11px;
      margin-top: 7px;
      color: #ddd;
      font-size: 14px;
      word-break: break-word;
    }

    .commentName {
      color: #f5d76e;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .commentText {
      color: #ddd;
    }

    .noComments {
      color: #666;
      font-size: 13px;
      text-align: center;
      padding: 5px;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin: 30px 0;
      padding-bottom: 10px;
    }

    .goldLine {
      width: 70px;
      height: 2px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">📸 Picture Chat</div>
    <div class="subtitle">Premium Photo Sharing</div>
    <div class="goldLine"></div>
  </div>

  <div class="container">

    <div class="card">

      <h1>✨ স্বাগতম</h1>

      <p>
        আপনার ছবি শেয়ার করুন এবং অন্যদের ছবিতে ❤️ Like ও 💬 Comment দিন।
      </p>

      <!-- নাম একবার সেট করার জায়গা -->

      <div class="userNameBox">

        <div class="userNameTitle">
          👤 আপনার নাম
        </div>

        <input
          type="text"
          id="userNameInput"
          maxlength="30"
          placeholder="আপনার নাম লিখুন..."
        >

        <button id="saveNameButton">
          💾 নাম সেভ করুন
        </button>

        <div id="savedName"></div>

      </div>


      <div class="fileBox">
        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >
      </div>

      <img id="preview" alt="ছবির প্রিভিউ">

      <button id="postButton">
        📤 পোস্ট করুন
      </button>

      <p id="message"></p>

    </div>

    <div id="posts"></div>

    <div class="footer">
      🖤 Picture Chat • 2026 ✨
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://syzauwriwjwnlwbcxlnf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_af7xm3dnJhVO5XGXRIiyRA_zDOT230o";

    const BUCKET = "photos";


    /* =========================
       User Name
    ========================= */

    const userNameInput =
      document.getElementById("userNameInput");

    const saveNameButton =
      document.getElementById("saveNameButton");

    const savedName =
      document.getElementById("savedName");


    let currentUserName =
      localStorage.getItem(
        "pictureChatName"
      ) || "";


    function showSavedName() {

      if (currentUserName) {

        userNameInput.value =
          currentUserName;

        savedName.innerText =
          "✅ আপনার নাম: " +
          currentUserName;

        saveNameButton.innerText =
          "✏️ নাম পরিবর্তন করুন";

      }

    }


    saveNameButton.addEventListener(
      "click",
      function () {

        const name =
          userNameInput.value.trim();


        if (!name) {

          savedName.innerText =
            "⚠️ আগে আপনার নাম লিখুন।";

          userNameInput.focus();

          return;
        }


        currentUserName =
          name;


        localStorage.setItem(
          "pictureChatName",
          currentUserName
        );


        savedName.innerText =
          "✅ আপনার নাম: " +
          currentUserName;


        saveNameButton.innerText =
          "✏️ নাম পরিবর্তন করুন";

      }
    );


    showSavedName();


    /* =========================
       Main Elements
    ========================= */

    const photoInput =
      document.getElementById("photoInput");

    const preview =
      document.getElementById("preview");

    const postButton =
      document.getElementById("postButton");

    const posts =
      document.getElementById("posts");

    const message =
      document.getElementById("message");


    let selectedFile = null;


    /* =========================
       ছবি নির্বাচন
    ========================= */

    photoInput.addEventListener(
      "change",
      function () {

        const file = this.files[0];

        if (!file) {
          return;
        }

        selectedFile = file;

        const reader =
          new FileReader();


        reader.onload =
          function (event) {

            preview.src =
              event.target.result;

            preview.style.display =
              "block";

            message.innerText =
              "✅ ছবি প্রস্তুত। এখন পোস্ট করুন.";

          };


        reader.readAsDataURL(file);

      }
    );


    /* =========================
       Comments লোড
    ========================= */

    async function loadComments(
      fileName,
      commentsList
    ) {

      commentsList.innerHTML =
        "<div class='noComments'>⏳ Comment লোড হচ্ছে...</div>";


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/photo_comments" +
            "?select=comment,created_at" +
            "&file_name=eq." +
            encodeURIComponent(fileName) +
            "&order=created_at.desc",
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY
              }
            }
          );


        if (!response.ok) {

          throw new Error(
            await response.text()
          );

        }


        const comments =
          await response.json();


        commentsList.innerHTML = "";


        if (
          !comments ||
          comments.length === 0
        ) {

          commentsList.innerHTML =
            "<div class='noComments'>এখনও কোনো Comment নেই।</div>";

          return;

        }


        comments.forEach(
          function(item) {

            const commentItem =
              document.createElement(
                "div"
              );

            commentItem.className =
              "commentItem";


            /*
              নতুন Comment:

              Name|||Comment

              পুরোনো Comment:
              শুধু Comment
            */

            const parts =
              item.comment.split(
                "|||"
              );


            let userName =
              "Anonymous";

            let userComment =
              item.comment;


            if (parts.length >= 2) {

              userName =
                parts[0].trim();

              userComment =
                parts
                  .slice(1)
                  .join("|||")
                  .trim();

            }


            const commentName =
              document.createElement(
                "div"
              );

            commentName.className =
              "commentName";

            commentName.innerText =
              "👤 " + userName;


            const commentText =
              document.createElement(
                "div"
              );

            commentText.className =
              "commentText";

            commentText.innerText =
              "💬 " + userComment;


            commentItem.appendChild(
              commentName
            );

            commentItem.appendChild(
              commentText
            );


            commentsList.appendChild(
              commentItem
            );

          }
        );


      } catch (error) {

        console.log(
          "Comment load error:",
          error
        );


        commentsList.innerHTML =
          "<div class='noComments'>❌ Comment লোড হয়নি</div>";

      }

    }


    /* =========================
       ছবি লোড
    ========================= */

    async function loadPosts() {

      posts.innerHTML =
        "<p style='text-align:center;color:#aaa;'>⏳ ছবি লোড হচ্ছে...</p>";


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/storage/v1/object/list/" +
            BUCKET,
            {
              method: "POST",

              headers: {
                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                prefix: "",
                limit: 100,

                sortBy: {
                  column:
                    "created_at",

                  order:
                    "desc"
                }

              })
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText
          );

        }


        const files =
          await response.json();


        posts.innerHTML = "";


        if (
          !files ||
          files.length === 0
        ) {

          posts.innerHTML =
            "<p style='text-align:center;color:#aaa;'>এখনও কোনো ছবি নেই।</p>";

          return;

        }


        for (
          const file of files
        ) {

          if (!file.name) {
            continue;
          }


          const imageUrl =
            SUPABASE_URL +
            "/storage/v1/object/public/" +
            BUCKET +
            "/" +
            encodeURIComponent(
              file.name
            );


          let likes = 0;


          /* =========================
             Like count
          ========================= */

          try {

            const likeResponse =
              await fetch(
                SUPABASE_URL +
                "/rest/v1/photo_posts" +
                "?select=likes" +
                "&file_name=eq." +
                encodeURIComponent(
                  file.name
                ),
                {
                  method: "GET",

                  headers: {
                    "apikey":
                      SUPABASE_KEY,

                    "Authorization":
                      "Bearer " +
                      SUPABASE_KEY
                  }
                }
              );


            if (likeResponse.ok) {

              const likeData =
                await likeResponse.json();


              if (
                likeData.length > 0 &&
                likeData[0].likes != null
              ) {

                likes =
                  Number(
                    likeData[0].likes
                  );

              }

            }

          } catch (e) {

            console.log(
              "Like count error:",
              e
            );

          }


          /* =========================
             Post
          ========================= */

          const post =
            document.createElement(
              "div"
            );

          post.className =
            "post";


          /* Image */

          const image =
            document.createElement(
              "img"
            );

          image.src =
            imageUrl;

          image.alt =
            "Shared photo";

          image.loading =
            "lazy";


          /* =========================
             Like Button
          ========================= */

          const likeButton =
            document.createElement(
              "button"
            );

          likeButton.className =
            "likeButton";

          likeButton.innerText =
            "❤️ Like";


          /* Like Count */

          const likeCount =
            document.createElement(
              "div"
            );

          likeCount.className =
            "likeCount";

          likeCount.innerText =
            "❤️ " +
            likes +
            " Likes";


          /* Like Click */

          likeButton.addEventListener(
            "click",
            async function () {

              likeButton.disabled =
                true;

              likeButton.innerText =
                "⏳ Like হচ্ছে...";


              try {

                const updateResponse =
                  await fetch(
                    SUPABASE_URL +
                    "/rest/v1/photo_posts" +
                    "?file_name=eq." +
                    encodeURIComponent(
                      file.name
                    ),
                    {
                      method:
                        "PATCH",

                      headers: {
                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          "Bearer " +
                          SUPABASE_KEY,

                        "Content-Type":
                          "application/json",

                        "Prefer":
                          "return=representation"
                      },

                      body:
                        JSON.stringify({
                          likes:
                            likes + 1
                        })
                    }
                  );


                if (
                  !updateResponse.ok
                ) {

                  throw new Error(
                    await updateResponse.text()
                  );

                }


                likes++;


                likeCount.innerText =
                  "❤️ " +
                  likes +
                  " Likes";


                likeButton.innerText =
                  "❤️ Like";


              } catch (error) {

                console.log(
                  "Like error:",
                  error
                );


                likeButton.innerText =
                  "❌ আবার চেষ্টা করুন";

              }


              likeButton.disabled =
                false;

            }
          );


          /* =========================
             Comment Section
          ========================= */

          const commentBox =
            document.createElement(
              "div"
            );

          commentBox.className =
            "commentBox";


          const commentTitle =
            document.createElement(
              "div"
            );

          commentTitle.className =
            "commentTitle";

          commentTitle.innerText =
            "💬 Comments";


          /*
            এখানে আর Name Input নেই।
            নাম উপরে একবার সেট করা হবে।
          */


          const commentInput =
            document.createElement(
              "textarea"
            );

          commentInput.className =
            "commentInput";

          commentInput.maxLength =
            500;

          commentInput.placeholder =
            "💬 আপনার Comment লিখুন...";


          const commentButton =
            document.createElement(
              "button"
            );

          commentButton.className =
            "commentButton";

          commentButton.innerText =
            "💬 Comment করুন";


          const commentsList =
            document.createElement(
              "div"
            );

          commentsList.className =
            "commentsList";


          /* =========================
             Comment Submit
          ========================= */

          commentButton.addEventListener(
            "click",
            async function () {

              const comment =
                commentInput.value.trim();


              /*
                আগে নাম সেট করা হয়েছে কিনা
                চেক করা হচ্ছে।
              */

              if (!currentUserName) {

                alert(
                  "⚠️ আগে উপরে আপনার নাম সেট করুন।"
                );

                userNameInput.focus();

                return;

              }


              if (!comment) {

                commentInput.focus();

                return;

              }


              commentButton.disabled =
                true;

              commentButton.innerText =
                "⏳ Comment হচ্ছে...";


              try {

                /*
                  Name + Comment

                  Format:
                  Name|||Comment
                */

                const savedComment =
                  currentUserName +
                  "|||" +
                  comment;


                const commentResponse =
                  await fetch(
                    SUPABASE_URL +
                    "/rest/v1/photo_comments",
                    {
                      method:
                        "POST",

                      headers: {
                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          "Bearer " +
                          SUPABASE_KEY,

                        "Content-Type":
                          "application/json",

                        "Prefer":
                          "return=minimal"
                      },

                      body:
                        JSON.stringify({
                          file_name:
                            file.name,

                          comment:
                            savedComment
                        })
                    }
                  );


                if (
                  !commentResponse.ok
                ) {

                  throw new Error(
                    await commentResponse.text()
                  );

                }


                commentInput.value =
                  "";


                await loadComments(
                  file.name,
                  commentsList
                );


              } catch (error) {

                console.log(
                  "Comment error:",
                  error
                );


                alert(
                  "❌ Comment পোস্ট হয়নি"
                );

              }


              commentButton.disabled =
                false;

              commentButton.innerText =
                "💬 Comment করুন";

            }
          );


          /* =========================
             Comment UI
          ========================= */

          commentBox.appendChild(
            commentTitle
          );

          commentBox.appendChild(
            commentInput
          );

          commentBox.appendChild(
            commentButton
          );

          commentBox.appendChild(
            commentsList
          );


          /* =========================
             Post UI
          ========================= */

          post.appendChild(
            image
          );

          post.appendChild(
            likeButton
          );

          post.appendChild(
            likeCount
          );

          post.appendChild(
            commentBox
          );


          posts.appendChild(
            post
          );


          /* Load Comments */

          await loadComments(
            file.name,
            commentsList
          );

        }


      } catch (error) {

        console.log(
          "Load error:",
          error
        );


        posts.innerHTML =
          "<p style='text-align:center;color:#ff6b6b;'>❌ ছবি লোড হয়নি</p>";

      }

    }


    /* =========================
       নতুন ছবি পোস্ট
    ========================= */

    postButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {

          message.innerText =
            "⚠️ আগে একটি ছবি নির্বাচন করুন।";

          return;

        }


        postButton.disabled =
          true;

        message.innerText =
          "⏳ ছবি আপলোড হচ্ছে...";


        try {

          const safeFileName =
            selectedFile.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const fileName =
            Date.now() +
            "-" +
            safeFileName;


          const uploadUrl =
            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET +
            "/" +
            encodeURIComponent(
              fileName
            );


          const uploadResponse =
            await fetch(
              uploadUrl,
              {
                method:
                  "POST",

                headers: {
                  "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                  "apikey":
                    SUPABASE_KEY,

                  "Content-Type":
                    selectedFile.type ||
                    "application/octet-stream"
                },

                body:
                  selectedFile
              }
            );


          if (
            !uploadResponse.ok
          ) {

            throw new Error(
              await uploadResponse.text()
            );

          }


          /* Database record */

          const dbResponse =
            await fetch(
              SUPABASE_URL +
              "/rest/v1/photo_posts",
              {
                method:
                  "POST",

                headers: {
                  "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                  "apikey":
                    SUPABASE_KEY,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=minimal"
                },

                body:
                  JSON.stringify({
                    file_name:
                      fileName,

                    likes:
                      0
                  })
              }
            );


          if (
            !dbResponse.ok
          ) {

            console.log(
              "Database error:",
              await dbResponse.text()
            );

          }


          message.innerText =
            "🎉 ছবি সফলভাবে পোস্ট হয়েছে!";


          selectedFile =
            null;

          photoInput.value =
            "";

          preview.src =
            "";

          preview.style.display =
            "none";

          postButton.disabled =
            false;


          await loadPosts();


        } catch (error) {

          console.log(
            "Upload error:",
            error
          );


          message.innerText =
            "❌ আপলোড হয়নি";


          postButton.disabled =
            false;

        }

      }
    );


    /* =========================
       Website Start
    ========================= */

    loadPosts();

  </script>

</body>
</html>
